<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Quiz — The Orthodox Expedition</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Caveat:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --gold:#c9922a;
  --gold-light:#f0c96e;
  --gold-bright:#ffd700;
  --parchment:#f4e8c1;
  --ink:#1a0f00;
  --burgundy:#6b1a1a;
  --byzantine:#2c1654;
  --bg:#0e0800;
  --green:#16a34a;
  --green-soft:rgba(22,163,74,0.18);
  --red-soft:rgba(220,38,38,0.18);
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{min-height:100%;overflow-x:hidden;}
body{
  font-family:'Crimson Text',serif;
  background:var(--bg);
  background-image:
    radial-gradient(ellipse at 50% 0%,rgba(107,26,26,0.5) 0%,transparent 55%),
    radial-gradient(ellipse at 100% 100%,rgba(44,22,84,0.35) 0%,transparent 50%);
  min-height:100vh;
  color:var(--parchment);
  padding:1rem 1rem 4rem;
}
body::before{
  content:'';
  position:fixed;
  inset:0;
  background-image:
    linear-gradient(rgba(201,146,42,0.02) 1px,transparent 1px),
    linear-gradient(90deg,rgba(201,146,42,0.02) 1px,transparent 1px);
  background-size:44px 44px;
  pointer-events:none;
  z-index:0;
}

.quiz-container{
  max-width:680px;
  margin:0 auto;
  position:relative;
  z-index:1;
}

/* ── HEADER ───────────────────────────────────────── */
.quiz-header{
  text-align:center;
  padding:1.25rem 0 1.5rem;
  border-bottom:1px solid rgba(201,146,42,0.15);
  margin-bottom:2rem;
  position:relative;
}
.back-link{
  display:inline-block;
  font-family:'Cinzel',serif;
  font-size:0.7rem;
  letter-spacing:0.15em;
  color:rgba(201,146,42,0.55);
  text-decoration:none;
  text-transform:uppercase;
  padding:0.5rem 0.875rem;
  min-height:40px;
  border:1px solid rgba(201,146,42,0.15);
  border-radius:8px;
  margin-bottom:1.25rem;
  align-self:flex-start;
}
.back-link:hover{color:var(--gold-light);border-color:rgba(201,146,42,0.35);}
.quiz-eyebrow{
  font-family:'Cinzel',serif;
  font-size:0.7rem;
  letter-spacing:0.25em;
  color:rgba(201,146,42,0.55);
  text-transform:uppercase;
  margin-bottom:0.4rem;
}
.quiz-title{
  font-family:'Cinzel Decorative',serif;
  font-size:clamp(1.4rem,4.5vw,1.85rem);
  color:var(--gold-light);
  text-shadow:0 0 20px rgba(201,146,42,0.35);
  margin-bottom:0.4rem;
  font-weight:400;
  line-height:1.2;
  padding:0 0.5rem;
}
.quiz-session-tag{
  font-family:'Caveat',cursive;
  font-size:1.1rem;
  color:rgba(201,146,42,0.7);
  font-style:italic;
  margin-bottom:0.6rem;
}
.quiz-description{
  font-size:0.95rem;
  color:rgba(244,232,193,0.75);
  margin:0.5rem auto 0.875rem;
  max-width:540px;
  line-height:1.5;
  font-style:italic;
}
.quiz-meta-row{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:0.5rem;
  margin-top:0.875rem;
}
.quiz-meta-chip{
  font-family:'Cinzel',serif;
  font-size:0.65rem;
  letter-spacing:0.12em;
  color:rgba(201,146,42,0.65);
  text-transform:uppercase;
  padding:0.3rem 0.6rem;
  background:rgba(44,22,84,0.18);
  border:1px solid rgba(201,146,42,0.15);
  border-radius:8px;
}

/* ── QUESTION CARDS ───────────────────────────────── */
.quiz-question{
  background:linear-gradient(160deg,rgba(244,232,193,0.04),rgba(244,232,193,0.01));
  border:1.5px solid rgba(201,146,42,0.18);
  border-radius:14px;
  padding:1.5rem 1.25rem;
  margin-bottom:1.25rem;
}
.quiz-question-counter{
  font-family:'Cinzel',serif;
  font-size:0.65rem;
  letter-spacing:0.2em;
  color:rgba(201,146,42,0.5);
  text-transform:uppercase;
  margin-bottom:0.6rem;
}
.quiz-question-text{
  font-size:1.1rem;
  color:rgba(244,232,193,0.95);
  line-height:1.55;
  margin-bottom:1rem;
  font-weight:400;
}
.quiz-options{display:flex;flex-direction:column;gap:0.5rem;}
.quiz-option{
  display:flex;
  align-items:center;
  gap:0.75rem;
  padding:0.875rem 1rem;
  background:rgba(14,8,0,0.4);
  border:1px solid rgba(201,146,42,0.18);
  border-radius:10px;
  cursor:pointer;
  min-height:52px;
  transition:border-color 0.15s,background 0.15s;
  position:relative;
}
.quiz-option:hover{border-color:rgba(201,146,42,0.4);}
.quiz-option input[type="radio"]{
  appearance:none;
  -webkit-appearance:none;
  width:1.1rem;
  height:1.1rem;
  border-radius:50%;
  border:1.5px solid rgba(201,146,42,0.45);
  background:transparent;
  flex-shrink:0;
  position:relative;
  cursor:pointer;
}
.quiz-option input[type="radio"]:checked{
  border-color:var(--gold-bright);
  background:radial-gradient(circle, var(--gold-bright) 0 40%, transparent 50%);
  box-shadow:0 0 8px rgba(255,215,0,0.4);
}
.quiz-option input[type="radio"]:disabled{cursor:default;}
.option-letter{
  font-family:'Cinzel',serif;
  font-size:0.78rem;
  letter-spacing:0.1em;
  color:rgba(201,146,42,0.65);
  font-weight:700;
  flex-shrink:0;
  width:1rem;
  text-align:center;
}
.option-text{flex:1;font-size:0.98rem;color:rgba(244,232,193,0.85);line-height:1.4;}
.option-mark{
  font-family:'Cinzel',serif;
  font-size:1rem;
  font-weight:700;
  margin-left:auto;
  flex-shrink:0;
  width:1.5rem;
  text-align:center;
}

.quiz-option.option-selected{
  background:rgba(107,26,26,0.18);
  border-color:rgba(255,215,0,0.45);
}

/* Locked / completed-view styling */
.quiz-option.quiz-option-locked{cursor:default;}
.quiz-option.option-correct{
  background:var(--green-soft);
  border-color:rgba(22,163,74,0.55);
}
.quiz-option.option-correct .option-text{color:rgba(187,247,208,0.95);}
.quiz-option.option-correct .option-mark{color:rgba(134,239,172,0.95);}
.quiz-option.option-wrong-pick{
  background:var(--red-soft);
  border-color:rgba(220,38,38,0.5);
}
.quiz-option.option-wrong-pick .option-mark{color:rgba(252,165,165,0.95);}

/* Retake-only: show the previously chosen option in muted form */
.quiz-option.quiz-option-retake.option-was-picked{
  background:rgba(244,232,193,0.05);
  border-color:rgba(201,146,42,0.3);
  border-style:dashed;
}
.option-was-mark{
  font-family:'Caveat',cursive;
  font-size:0.95rem;
  font-style:italic;
  color:rgba(201,146,42,0.55);
  margin-left:auto;
  flex-shrink:0;
  white-space:nowrap;
}

/* ── EXPLANATION (after answer revealed) ─────────── */
.quiz-explanation{
  margin-top:1rem;
  padding:0.875rem 1rem;
  background:rgba(44,22,84,0.18);
  border-left:3px solid var(--gold);
  border-radius:6px;
  font-size:0.95rem;
  color:rgba(244,232,193,0.85);
  line-height:1.55;
  font-style:italic;
}
.retake-history-line{
  margin-top:0.75rem;
  font-family:'Caveat',cursive;
  font-size:1rem;
  color:rgba(201,146,42,0.65);
  font-style:italic;
}
.quiz-question.q-correct{border-color:rgba(22,163,74,0.35);}
.quiz-question.q-wrong{border-color:rgba(220,38,38,0.3);}

/* ── PROGRESS / SUBMIT ────────────────────────────── */
.quiz-progress-summary{
  text-align:center;
  margin:1.5rem 0 0.875rem;
  font-family:'Cinzel',serif;
  font-size:0.7rem;
  letter-spacing:0.18em;
  color:rgba(201,146,42,0.55);
  text-transform:uppercase;
}
.quiz-submit-btn{
  display:block;
  width:100%;
  padding:1rem;
  margin-top:0.5rem;
  background:linear-gradient(135deg,var(--gold),var(--gold-bright));
  border:none;
  border-radius:14px;
  font-family:'Cinzel',serif;
  font-size:0.85rem;
  letter-spacing:0.15em;
  color:var(--bg);
  font-weight:700;
  cursor:pointer;
  text-transform:uppercase;
  min-height:56px;
  opacity:0.4;
  transition:opacity 0.2s;
}
.quiz-submit-btn.ready{opacity:1;box-shadow:0 4px 22px rgba(255,215,0,0.25);}
.quiz-submit-btn:disabled:not(.ready){cursor:not-allowed;}
.quiz-form-error{
  margin-top:0.75rem;
  text-align:center;
  font-family:'Cinzel',serif;
  font-size:0.72rem;
  letter-spacing:0.1em;
  color:rgba(244,180,180,0.9);
  text-transform:uppercase;
  min-height:1rem;
}

/* ── COMPLETION BANNER ───────────────────────────── */
.quiz-completion-banner{
  text-align:center;
  padding:2rem 1.25rem 1.5rem;
  background:linear-gradient(160deg,rgba(44,22,84,0.3),rgba(107,26,26,0.18));
  border:1.5px solid rgba(255,215,0,0.3);
  border-radius:16px;
  margin-bottom:2rem;
  box-shadow:0 0 30px rgba(255,215,0,0.08);
}
.quiz-completion-banner.banner-perfect{
  border-color:rgba(255,215,0,0.55);
  box-shadow:0 0 40px rgba(255,215,0,0.18);
}
.completion-icon{
  font-size:2.5rem;
  color:var(--gold-bright);
  text-shadow:0 0 18px rgba(255,215,0,0.45);
  margin-bottom:0.5rem;
}
.completion-eyebrow{
  font-family:'Cinzel',serif;
  font-size:0.78rem;
  letter-spacing:0.25em;
  color:var(--gold-light);
  text-transform:uppercase;
  margin-bottom:0.875rem;
}
.completion-score{
  font-size:1.05rem;
  color:rgba(244,232,193,0.9);
  line-height:1.55;
  max-width:540px;
  margin:0 auto;
}
.score-strong{color:var(--gold-bright);font-family:'Cinzel',serif;font-size:1.05rem;letter-spacing:0.05em;}

/* ── RETAKE BANNER ───────────────────────────────── */
.retake-banner{
  background:linear-gradient(160deg,rgba(44,22,84,0.25),rgba(244,232,193,0.04));
  border:1.5px solid rgba(201,146,42,0.3);
  border-radius:14px;
  padding:1.5rem 1.25rem;
  margin-bottom:1.5rem;
  text-align:center;
}

/* ── GENERIC CARD (errors, sign-in, retake) ──────── */
.quiz-card{
  background:linear-gradient(160deg,rgba(244,232,193,0.04),rgba(244,232,193,0.01));
  border:1.5px solid rgba(201,146,42,0.18);
  border-radius:14px;
  padding:2rem 1.5rem;
  margin-bottom:1.5rem;
  text-align:center;
}
.quiz-card.error-card{border-color:rgba(220,38,38,0.3);}
.quiz-card-icon{
  font-size:2rem;
  color:var(--gold);
  margin-bottom:0.6rem;
}
.quiz-card-title{
  font-family:'Cinzel Decorative',serif;
  font-size:1.2rem;
  color:var(--gold-light);
  margin-bottom:0.6rem;
}
.quiz-card-body{
  font-size:1rem;
  color:rgba(244,232,193,0.75);
  line-height:1.6;
  max-width:540px;
  margin:0 auto;
}

/* ── BOTTOM ACTIONS ──────────────────────────────── */
.quiz-bottom-actions{
  margin-top:2rem;
  text-align:center;
  padding-top:1.5rem;
  border-top:1px solid rgba(201,146,42,0.12);
}
.quiz-back-btn{
  display:inline-block;
  padding:0.875rem 2rem;
  min-height:48px;
  background:rgba(44,22,84,0.3);
  border:1px solid rgba(201,146,42,0.3);
  border-radius:12px;
  font-family:'Cinzel',serif;
  font-size:0.78rem;
  letter-spacing:0.15em;
  color:var(--gold-light);
  text-decoration:none;
  text-transform:uppercase;
}
.quiz-back-btn:hover{
  border-color:rgba(255,215,0,0.45);
  background:rgba(107,26,26,0.25);
}

/* ── LOADING ─────────────────────────────────────── */
.loading{
  text-align:center;
  padding:4rem 2rem;
  font-family:'Cinzel',serif;
  font-size:0.8rem;
  letter-spacing:0.15em;
  color:rgba(201,146,42,0.5);
  text-transform:uppercase;
}

/* ── RESPONSIVE ──────────────────────────────────── */
@media (min-width:560px){
  .quiz-question{padding:1.75rem 1.75rem;}
  .quiz-option{padding:1rem 1.25rem;}
  .quiz-question-text{font-size:1.15rem;}
}
</style>
</head>

<body>
<div class="quiz-container" id="page-root">
  <div class="loading">Opening the quiz...</div>
</div>

<script src="js/quiz-runner.js"></script>
<script>
const SUPABASE_URL = 'https://ksfnsryfmkafwirzgjoe.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtzZm5zcnlmbWthZndpcnpnam9lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2ODM4MTcsImV4cCI6MjA5MTI1OTgxN30.mHQty44WBnjQY8BJ8KbPk_pp-yTcOaifGxCZPUO4xpY';

(async function main(){
  const root = document.getElementById('page-root');

  // Read URL params
  const sessionId = QuizRunner.getParam('session');
  const quizType = QuizRunner.getParam('type') || 'friday';

  if (!sessionId) {
    root.innerHTML = `
      <div class="quiz-header"><a href="week.html" class="back-link">← Back to the week</a></div>
      <div class="quiz-card error-card">
        <div class="quiz-card-icon">⚠</div>
        <div class="quiz-card-title">No quiz specified</div>
        <div class="quiz-card-body">It looks like this page was opened without a session in the URL. Go back to the week and click the Friday quiz button there.</div>
      </div>
    `;
    return;
  }
  if (!QuizRunner.TYPE_LABELS[quizType]) {
    root.innerHTML = `
      <div class="quiz-header"><a href="week.html" class="back-link">← Back to the week</a></div>
      <div class="quiz-card error-card">
        <div class="quiz-card-icon">⚠</div>
        <div class="quiz-card-title">Unknown quiz type</div>
        <div class="quiz-card-body">This page only supports Friday quizzes and monthly tests.</div>
      </div>
    `;
    return;
  }

  // Init Supabase + auth (4s timeout, same pattern as prayers.html / week.html)
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  let profileId = null;
  try {
    const timer = new Promise(r => setTimeout(() => r(null), 4000));
    const res = await Promise.race([sb.auth.getSession(), timer]);
    const session = res?.data?.session ?? null;
    if (session) profileId = session.user.id;
  } catch (e) {
    console.warn('Auth check failed; rendering quiz in signed-out mode.', e);
  }

  // Load quiz data
  let ctx;
  try {
    ctx = await QuizRunner.load(sb, profileId, sessionId, quizType);
  } catch (e) {
    console.error('Quiz load failed.', e);
    root.innerHTML = `
      <div class="quiz-header"><a href="week.html" class="back-link">← Back to the week</a></div>
      <div class="quiz-card error-card">
        <div class="quiz-card-icon">⚠</div>
        <div class="quiz-card-title">Could not load this quiz</div>
        <div class="quiz-card-body">Something went wrong reading from the database. Try refreshing or going back to the week.</div>
      </div>
    `;
    return;
  }

  // Render the right view
  root.innerHTML = QuizRunner.render(profileId, ctx);

  // Wire up handlers (only matters for fresh-attempt + retake-offer views)
  QuizRunner.attachHandlers(sb, profileId, ctx);
})();
</script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>

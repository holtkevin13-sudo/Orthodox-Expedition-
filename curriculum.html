<style>
/* ── PALETTE TOKENS ────────────────────────────────────────── */
:root{
  --gold:#c9922a;--gold-light:#f0c96e;--gold-bright:#ffd700;
  --parchment:#f4e8c1;--parchment-dark:#e8d5a0;
  --ink:#1a0f00;
  --burgundy:#6b1a1a;
  --byzantine:#2c1654;
  --bg:#0e0800;
  --nav-h:72px;
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{min-height:100%;overflow-x:hidden;}
body{
  font-family:'Crimson Text',serif;
  background-color:var(--bg);
  background-image:
    radial-gradient(ellipse at 50% 0%,rgba(107,26,26,0.45) 0%,transparent 55%),
    radial-gradient(ellipse at 100% 100%,rgba(44,22,84,0.3) 0%,transparent 50%);
  min-height:100vh;color:var(--parchment);
}
body::before{
  content:'';position:fixed;inset:0;
  background-image:
    linear-gradient(rgba(201,146,42,0.022) 1px,transparent 1px),
    linear-gradient(90deg,rgba(201,146,42,0.022) 1px,transparent 1px);
  background-size:44px 44px;pointer-events:none;z-index:0;
}

/* ── LOADING ───────────────────────────────────────────────── */
#loading{
  position:fixed;inset:0;z-index:400;
  display:flex;align-items:center;justify-content:center;
  background:var(--bg);transition:opacity 0.4s;
}
.loading-cross{
  font-family:'Cinzel',serif;font-size:2rem;color:rgba(240,201,110,0.7);
  animation:pulse 1.5s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:0.3;}50%{opacity:0.8;}}

/* ── APP ───────────────────────────────────────────────────── */
#app{display:none;position:relative;z-index:1;}
.page{max-width:var(--container-max-width);margin:0 auto;padding:1.25rem 1rem calc(var(--nav-h) + 1.5rem);}

/* ── HEADER (matches progress.html / home.html pattern) ────── */
.app-header{
  text-align:center;padding:1.25rem 1rem 1rem;
  border-bottom:1px solid rgba(201,146,42,0.18);
  margin-bottom:1.25rem;position:relative;
}
.app-header-row{display:flex;align-items:center;justify-content:space-between;}
.app-name{
  font-family:'Cinzel Decorative',serif;
  font-size:clamp(0.95rem,3.5vw,1.2rem);
  color:var(--gold-light);letter-spacing:0.06em;
  text-shadow:0 0 20px rgba(201,146,42,0.35);
  flex:1;text-align:center;
}
.back-btn{
  background:none;border:none;cursor:pointer;
  color:rgba(240,201,110,0.7);font-size:0.85rem;
  font-family:'Cinzel',serif;padding:0.25rem 0.5rem;
  text-decoration:none;
}
.app-divider{
  color:rgba(240,201,110,0.65);letter-spacing:0.6rem;
  font-size:0.65rem;margin-top:0.3rem;
}

/* ── PAGE TITLE BLOCK ──────────────────────────────────────── */
.page-eyebrow{
  font-family:'Cinzel',serif;font-size:0.7rem;letter-spacing:0.22em;
  color:rgba(240,201,110,0.7);text-transform:uppercase;
  text-align:center;margin-bottom:0.4rem;
}
.page-title{
  font-family:'Cinzel Decorative',serif;
  font-size:clamp(1.3rem,4.5vw,1.6rem);
  color:var(--gold-light);text-align:center;
  text-shadow:0 0 20px rgba(201,146,42,0.3);
  margin-bottom:0.4rem;
}
.page-subtitle{
  font-family:'Crimson Text',serif;font-size:0.85rem;
  color:rgba(244,232,193,0.55);text-align:center;
  font-style:italic;line-height:1.4;
  margin-bottom:1.5rem;padding:0 0.5rem;
}

/* ── TOPIC BLOCK (active — Topic 00) ───────────────────────── */
.topic-block{margin-bottom:1.75rem;}
.topic-header{margin-bottom:0.875rem;padding:0 0.125rem;}
.topic-eyebrow{
  font-family:'Cinzel',serif;font-size:0.62rem;letter-spacing:0.18em;
  color:rgba(240,201,110,0.7);text-transform:uppercase;
  margin-bottom:0.3rem;
}
.topic-title{
  font-family:'Cinzel',serif;font-size:1rem;font-weight:700;
  color:var(--gold-light);line-height:1.3;
  margin-bottom:0.4rem;
}
.topic-progress-line{
  font-family:'Cinzel',serif;font-size:0.6rem;letter-spacing:0.1em;
  color:rgba(240,201,110,0.7);text-transform:uppercase;
}

/* ── SESSION CARDS ─────────────────────────────────────────── */
.session-list{display:flex;flex-direction:column;gap:0.625rem;}

.session-card{
  background:rgba(244,232,193,0.03);
  border:1px solid rgba(201,146,42,0.18);
  border-radius:11px;
  overflow:hidden;
  transition:all 0.2s ease;
}
.session-card.complete{
  background:rgba(22,163,74,0.06);
  border-color:rgba(22,163,74,0.25);
}
.session-card.current{
  background:rgba(201,146,42,0.05);
  border-color:rgba(240,201,110,0.65);
  box-shadow:0 0 0 1px rgba(201,146,42,0.12);
}

/* PRIMARY TAP TARGET — the session row */
.session-row{
  display:flex;align-items:center;gap:0.75rem;
  padding:0.875rem 0.875rem;
  text-decoration:none;color:inherit;
  cursor:pointer;
  transition:background 0.15s ease;
  min-height:60px;
}
.session-row:active{background:rgba(255,215,0,0.05);}
.session-row:hover{background:rgba(255,215,0,0.03);}

.session-row-main{
  flex:1;min-width:0;display:flex;flex-direction:column;gap:0.3rem;
}
.session-row-id-line{
  display:flex;align-items:baseline;gap:0.5rem;flex-wrap:wrap;
}
.session-id{
  font-family:'Cinzel',serif;font-size:0.6rem;letter-spacing:0.12em;
  color:rgba(240,201,110,0.7);text-transform:uppercase;
  flex-shrink:0;
}
.session-card.complete .session-id{color:rgba(134,239,172,0.65);}
.session-card.current .session-id{color:var(--gold-bright);}

.session-title{
  font-family:'Cinzel',serif;font-size:0.85rem;font-weight:600;
  color:rgba(244,232,193,0.85);line-height:1.3;
}
.session-card.complete .session-title{color:rgba(180,240,200,0.85);}
.session-card.current .session-title{color:var(--gold-light);}

/* DAY RAIL — matches home.html pattern exactly */
.day-rail-mini{
  display:flex;align-items:center;gap:0.45rem;
  flex-shrink:0;
}
.day-rail-mini .day-pair{
  display:flex;align-items:center;gap:0.25rem;
}
.day-rail-mini .day-dot{
  display:inline-flex;align-items:center;justify-content:center;
  width:16px;height:16px;border-radius:50%;
  font-size:0.6rem;font-weight:700;line-height:1;flex-shrink:0;
  background:transparent;border:1.5px solid rgba(201,146,42,0.3);
  color:transparent;
}
.day-rail-mini .day-dot.done{
  background:#ffd700;border-color:#ffd700;color:#0e0800;
  box-shadow:0 0 8px rgba(255,215,0,0.4);
}
.day-rail-mini .day-dot.today{
  background:rgba(244,232,193,0.92);border-color:rgba(255,215,0,0.6);
}
.day-rail-mini .day-dot-label{
  font-family:'Cinzel',serif;font-size:0.55rem;letter-spacing:0.12em;
  color:rgba(240,201,110,0.7);text-transform:uppercase;
}
.session-card.complete .day-rail-mini .day-dot.future{
  border-color:rgba(240,201,110,0.65);
}

/* ── RESOURCES SUB-BLOCK ───────────────────────────────────── */
.session-resources{
  display:flex;flex-wrap:wrap;gap:0.5rem 1rem;
  padding:0.5rem 0.875rem 0.75rem;
  border-top:1px dashed rgba(201,146,42,0.15);
  background:rgba(0,0,0,0.12);
}
.resource-link{
  display:inline-flex;align-items:center;gap:0.35rem;
  font-family:'Cinzel',serif;font-size:0.6rem;letter-spacing:0.08em;
  color:rgba(240,201,110,0.85);text-transform:uppercase;
  text-decoration:none;
  padding:0.25rem 0;
  border-bottom:1px solid transparent;
  transition:all 0.2s ease;
}
.resource-link:hover{
  color:var(--gold-light);
  border-bottom-color:rgba(240,201,110,0.7);
}
.resource-link:active{color:var(--gold-bright);}
.resource-icon{
  font-size:0.75rem;line-height:1;
  color:rgba(240,201,110,0.7);
}

/* ── LOCKED FUTURE TOPICS ──────────────────────────────────── */
.topic-locked-card{
  background:rgba(244,232,193,0.02);
  border:1px solid rgba(201,146,42,0.12);
  border-radius:11px;
  padding:1rem 1rem;
  margin-bottom:0.75rem;
  opacity:0.7;
  display:flex;align-items:center;gap:0.875rem;
}
.topic-locked-icon{
  font-family:'Cinzel',serif;font-size:0.85rem;
  width:32px;height:32px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:rgba(201,146,42,0.06);
  border:1px solid rgba(201,146,42,0.18);
  color:rgba(240,201,110,0.7);
  flex-shrink:0;
}
.topic-locked-body{flex:1;min-width:0;}
.topic-locked-eyebrow{
  font-family:'Cinzel',serif;font-size:0.55rem;letter-spacing:0.16em;
  color:rgba(240,201,110,0.7);text-transform:uppercase;
  margin-bottom:0.25rem;
}
.topic-locked-title{
  font-family:'Cinzel',serif;font-size:0.8rem;font-weight:600;
  color:rgba(244,232,193,0.5);line-height:1.3;
}
.topic-locked-status{
  font-family:'Cinzel',serif;font-size:0.55rem;letter-spacing:0.1em;
  color:rgba(240,201,110,0.7);text-transform:uppercase;
  flex-shrink:0;
}

/* ── BOTTOM NAV (matches home.html / progress.html) ────────── */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;
  height:var(--nav-h);
  background:rgba(8,4,0,0.97);
  border-top:1px solid rgba(201,146,42,0.18);
  display:flex;align-items:stretch;
  backdrop-filter:blur(16px);
  z-index:200;
  padding-bottom:env(safe-area-inset-bottom);
}
.nav-item{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:0.2rem;
  cursor:pointer;border:none;background:none;
  padding:0.5rem 0.25rem;position:relative;
  transition:all 0.2s;text-decoration:none;
}
.nav-item:active{background:rgba(201,146,42,0.06);}
.nav-mark{
  font-size:1rem;line-height:1;
  color:rgba(240,201,110,0.65);
  transition:all 0.25s;
}
.nav-label{
  font-family:'Cinzel',serif;font-size:0.52rem;
  letter-spacing:0.08em;text-transform:uppercase;
  color:rgba(240,201,110,0.65);
  transition:all 0.25s;
}
.nav-item.active .nav-mark{
  color:var(--gold-bright);
  text-shadow:0 0 12px rgba(255,215,0,0.6);
}
.nav-item.active .nav-label{color:var(--gold-light);}
.nav-item.active::before{
  content:'';position:absolute;top:0;left:20%;right:20%;
  height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);
  border-radius:0 0 2px 2px;
}

/* ── ANIMATIONS ────────────────────────────────────────────── */
.fade-up{opacity:0;transform:translateY(12px);animation:fadeUp 0.4s ease forwards;}
@keyframes fadeUp{to{opacity:1;transform:translateY(0);}}
.fade-up:nth-child(1){animation-delay:0.04s;}
.fade-up:nth-child(2){animation-delay:0.1s;}
.fade-up:nth-child(3){animation-delay:0.16s;}
.fade-up:nth-child(4){animation-delay:0.22s;}

/* ── ADMIN / PARENT BARS ───────────────────────────────────── */
.admin-bar{
  position:fixed;top:0;left:0;right:0;z-index:999;
  background:linear-gradient(90deg,rgba(44,22,84,0.97),rgba(107,26,26,0.97));
  border-bottom:1px solid rgba(201,146,42,0.3);
  display:none;align-items:center;justify-content:space-between;
  padding:0.4rem 1rem;gap:0.75rem;
}
.admin-bar.show{display:flex;}
.admin-bar-label{
  font-family:'Cinzel',serif;font-size:0.62rem;letter-spacing:0.15em;
  color:rgba(240,201,110,0.85);text-transform:uppercase;
}
.admin-bar-btn{
  background:none;border:1px solid rgba(201,146,42,0.3);
  border-radius:6px;padding:0.25rem 0.75rem;
  font-family:'Cinzel',serif;font-size:0.6rem;
  color:rgba(240,201,110,0.85);cursor:pointer;
  min-height:32px;transition:all 0.2s;
}
.admin-bar.show ~ #app .page{padding-top:calc(2.5rem + 1.25rem);}
</style>

<script>
// ── SUPABASE ──────────────────────────────────────────────────
const SUPABASE_URL = 'https://ksfnsryfmkafwirzgjoe.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtzZm5zcnlmbWthZndpcnpnam9lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2ODM4MTcsImV4cCI6MjA5MTI1OTgxN30.mHQty44WBnjQY8BJ8KbPk_pp-yTcOaifGxCZPUO4xpY';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ── STATE ─────────────────────────────────────────────────────
let profile = null;
let allTopics = [];
let topic00Sessions = [];   // sessions where id LIKE '00.%' (sidesteps stale 0.x collision)
let yearTopics = [];        // Year 1, 2, 3 — locked future topics
let progressById = {};      // session_progress rows keyed by session_id
let handoutsById = {};      // session_handouts rows keyed by session_id
let masteryById = {};       // topic_mastery rows keyed by topic_id

// ── HELPERS ───────────────────────────────────────────────────
function showAdminBar(){
  const bar = document.getElementById('admin-bar');
  if(bar) bar.classList.add('show');
}
function showParentBar(){
  const bar = document.getElementById('parent-bar');
  if(bar) bar.classList.add('show');
}
function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
  ));
}

// ── AUTH ──────────────────────────────────────────────────────
(async()=>{
  try {
    const timer = new Promise(r => setTimeout(() => r(null), 4000));
    const res   = await Promise.race([sb.auth.getSession(), timer]);
    const session = res?.data?.session ?? null;
    if(!session){ window.location.href='index.html'; return; }

    const {data:prof} = await sb.from('profiles').select('role').eq('id',session.user.id).single();
    const isAdminView    = new URLSearchParams(window.location.search).get('admin')==='1';
    const isParentAccess = prof && prof.role === 'parent';
    const isAdminAccess  = prof && ['superuser','admin'].includes(prof.role);

    // Admins without ?admin=1 go to admin panel
    if(isAdminAccess && !isAdminView){ window.location.href='admin.html'; return; }
    // Admins with ?admin=1 see admin bar
    if(isAdminAccess && isAdminView){ showAdminBar(); }
    // Parents see parent bar directly — no ?admin=1 needed
    if(isParentAccess){ showParentBar(); }

    await loadAll(session.user.id);
    document.getElementById('loading').style.display='none';
    document.getElementById('app').style.display='block';
    document.getElementById('bottom-nav').style.display='flex';
    propagateAdminQuery();
  } catch(e) {
    console.error('Curriculum error:', e);
    window.location.href='index.html';
  }
})();

// ── LOAD ──────────────────────────────────────────────────────
async function loadAll(userId){
  // CRITICAL: filter sessions by id LIKE '00.%' to sidestep stale 0.x collisions.
  // (7 stale 0.1-0.7 sessions sit at order_index 4-10 alongside Topic 00 sessions
  // due to FK constraints preventing cleanup; they share topic_id=0 but pre-date
  // the v3 schema. Filtering by id pattern guarantees a clean 15-row Topic 00 set.)
  const [profRes, topicsRes, sessionsRes, spRes, tmRes, handoutsRes] = await Promise.all([
    sb.from('profiles').select('*').eq('id',userId).single(),
    sb.from('topics').select('id,title,description,order_index,is_conclusion').order('order_index'),
    sb.from('sessions')
      .select('id,topic_id,title,order_index')
      .like('id','00.%')
      .order('order_index'),
    sb.from('session_progress')
      .select('session_id, day_1_completed_at, day_2_completed_at, day_3_completed_at')
      .eq('explorer_id',userId),
    sb.from('topic_mastery').select('topic_id,status').eq('explorer_id',userId),
    sb.from('session_handouts').select('session_id, pdf_url').like('session_id','00.%'),
  ]);

  profile         = profRes.data;
  allTopics       = topicsRes.data || [];
  topic00Sessions = sessionsRes.data || [];

  // Index session_progress and session_handouts by session_id
  progressById = {};
  (spRes.data || []).forEach(p => { progressById[p.session_id] = p; });
  handoutsById = {};
  (handoutsRes.data || []).forEach(h => { handoutsById[h.session_id] = h; });
  masteryById = {};
  (tmRes.data || []).forEach(m => { masteryById[m.topic_id] = m; });

  // Year topics = topics 1, 2, 3 (Year 1/2/3 — legitimate future content).
  // Topics 4-10 are explicit "Reserved — Repurposed Topic" placeholders;
  // hidden from the syllabus per ADHD-first "reduce, don't add" principle.
  yearTopics = allTopics.filter(t => t.id >= 1 && t.id <= 3);

  renderAll();
}

// ── RENDER ────────────────────────────────────────────────────
function renderAll(){
  const list = document.getElementById('topic-list');
  list.innerHTML = '';

  // Topic 00 — the active block (always rendered, always expanded)
  list.appendChild(renderActiveTopic00());

  // Year 1, 2, 3 — locked cards (collapsed, no expansion)
  yearTopics.forEach((topic, idx) => {
    list.appendChild(renderLockedTopic(topic, idx));
  });
}

// ── TOPIC 00 (active) ─────────────────────────────────────────
function renderActiveTopic00(){
  const block = document.createElement('section');
  block.className = 'topic-block fade-up';

  const total    = topic00Sessions.length;
  const complete = topic00Sessions.filter(s => sessionFullyComplete(s.id)).length;

  block.innerHTML = `
    <div class="topic-header">
      <div class="topic-eyebrow">Topic 00 · Active</div>
      <div class="topic-title">Coming Home — Entry Block</div>
      <div class="topic-progress-line">${complete} of ${total} sessions complete</div>
    </div>
    <div class="session-list" id="session-list-00"></div>
  `;

  const sessionList = block.querySelector('#session-list-00');

  // Determine the "current" session: first one not yet fully complete.
  // (If all complete, no card gets the 'current' highlight.)
  const currentSession = topic00Sessions.find(s => !sessionFullyComplete(s.id));
  const currentId = currentSession ? currentSession.id : null;

  topic00Sessions.forEach(s => {
    sessionList.appendChild(renderSessionCard(s, s.id === currentId));
  });

  return block;
}

// Determine if a session has all three days completed.
function sessionFullyComplete(sessionId){
  const p = progressById[sessionId];
  return !!(p && p.day_1_completed_at && p.day_2_completed_at && p.day_3_completed_at);
}

// ── DAY-RAIL DOTS (visual treatment matches home.html) ───────
// Today's day-of-week → which dot is "active today" (M=1, W=2, F=3; otherwise 0/none)
function todayDayN(){
  const dow = new Date().getDay(); // 0=Sun..6=Sat
  return dow === 1 ? 1 : dow === 3 ? 2 : dow === 5 ? 3 : 0;
}

function dotClass(progress, n, isCurrentSession){
  if(progress && progress[`day_${n}_completed_at`]) return 'done';
  // Only highlight "today" on the current session — otherwise every Mon would
  // light up M-dots across all 15 rows, which is misleading.
  if(isCurrentSession && n === todayDayN()) return 'today';
  return 'future';
}

function dotMarkup(progress, n, label, isCurrentSession){
  const cls = dotClass(progress, n, isCurrentSession);
  const glyph = cls === 'done' ? '✓' : '';
  return `<span class="day-pair">`+
    `<span class="day-dot ${cls}" aria-label="Day ${n} (${label}) ${cls}">${glyph}</span>`+
    `<span class="day-dot-label" aria-hidden="true">${label}</span>`+
    `</span>`;
}

// ── SESSION CARD ──────────────────────────────────────────────
function renderSessionCard(session, isCurrent){
  const progress = progressById[session.id] || null;
  const isComplete = sessionFullyComplete(session.id);
  const handout = handoutsById[session.id] || null;

  const classes = ['session-card'];
  if(isComplete) classes.push('complete');
  else if(isCurrent) classes.push('current');

  const card = document.createElement('div');
  card.className = classes.join(' ');

  // Determine whether to show the Quiz history resource link.
  // quiz-results.html is restricted to parent/admin/superuser roles by design,
  // so explorers (Nolan) don't see the link — keeps the resources block minimal.
  const isParentRoleAccess = profile && ['parent','admin','superuser'].includes(profile.role);

  // Build resource links (admin nav fix below appends ?admin=1 if needed)
  const resources = [];
  if(handout && handout.pdf_url){
    resources.push(
      `<a class="resource-link" href="${esc(handout.pdf_url)}" target="_blank" rel="noopener" `+
      `aria-label="Download handout PDF for session ${esc(session.id)}">`+
      `<span class="resource-icon">⌬</span>Handout PDF</a>`
    );
  }
  if(isParentRoleAccess){
    resources.push(
      `<a class="resource-link" href="quiz-results.html" `+
      `aria-label="View quiz history">`+
      `<span class="resource-icon">✓</span>Quiz History</a>`
    );
  }

  card.innerHTML = `
    <a class="session-row" href="week.html" aria-label="Open week view for session ${esc(session.id)}: ${esc(session.title)}">
      <div class="session-row-main">
        <div class="session-row-id-line">
          <span class="session-id">Session ${esc(session.id)}</span>
        </div>
        <span class="session-title">${esc(session.title)}</span>
      </div>
      <div class="day-rail-mini" role="group" aria-label="Mon Wed Fri progress for this session">
        ${dotMarkup(progress, 1, 'Mon', isCurrent)}
        ${dotMarkup(progress, 2, 'Wed', isCurrent)}
        ${dotMarkup(progress, 3, 'Fri', isCurrent)}
      </div>
    </a>
    ${resources.length ? `<div class="session-resources">${resources.join('')}</div>` : ''}
  `;

  return card;
}

// ── LOCKED FUTURE TOPIC ───────────────────────────────────────
function renderLockedTopic(topic, idx){
  const card = document.createElement('div');
  card.className = 'topic-locked-card fade-up';

  // Use mastery status if present; otherwise default to 'locked'
  const mastery = masteryById[topic.id];
  const status = mastery ? mastery.status : 'locked';
  const statusLabel = status === 'available' ? 'Available'
                    : status === 'pending'   ? 'Awaiting Approval'
                    : status === 'complete'  ? 'Complete'
                    : 'Coming Soon';

  card.innerHTML = `
    <div class="topic-locked-icon">${idx + 1}</div>
    <div class="topic-locked-body">
      <div class="topic-locked-eyebrow">Topic ${topic.id}</div>
      <div class="topic-locked-title">${esc(topic.title)}</div>
    </div>
    <div class="topic-locked-status">${esc(statusLabel)}</div>
  `;

  return card;
}

// ── ADMIN NAV FIX ─────────────────────────────────────────────
// Preserve ?admin=1 across nav links and dynamically-rendered links.
// Called once after the auth+render pipeline completes.
function propagateAdminQuery(){
  if(new URLSearchParams(window.location.search).get('admin') !== '1') return;

  const append = (a) => {
    const href = a.getAttribute('href');
    if(!href) return;
    if(href.startsWith('#') || href.startsWith('http')) return;
    if(href.includes('?admin=1') || href.includes('index.html')) return;
    a.setAttribute('href', href + '?admin=1');
  };

  document.querySelectorAll('.nav-item, .back-btn, .session-row, .resource-link')
    .forEach(append);
}
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="css/viewport.css">
<link rel="stylesheet" href="css/contrast.css">
<link rel="stylesheet" href="css/nav-polish.css">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prayer — The Orthodox Expedition</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="theme-color" content="#0e0800">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400;1,600&family=Caveat:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
/* ─── PALETTE ──────────────────────────────────────────────── */
:root{
  --gold:#c9922a;
  --gold-light:#f0c96e;
  --gold-bright:#ffd700;
  --parchment:#f4e8c1;
  --parchment-dark:#e8d5a0;
  --ink:#1a0f00;
  --burgundy:#6b1a1a;
  --byzantine:#2c1654;
  --bg:#0e0800;
  --nav-h:64px;
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{min-height:100%;overflow-x:hidden;}
body{
  font-family:'Crimson Text',serif;
  background:var(--bg);
  background-image:
    radial-gradient(ellipse at 50% 0%,rgba(107,26,26,0.5) 0%,transparent 55%),
    radial-gradient(ellipse at 100% 100%,rgba(44,22,84,0.35) 0%,transparent 50%);
  min-height:100vh;
  color:var(--text-primary);
  padding:0 0 calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-top:env(safe-area-inset-top);
}
body.no-nav{padding-bottom:env(safe-area-inset-bottom);}
body::before{
  content:'';
  position:fixed;
  inset:0;
  background-image:
    linear-gradient(rgba(201,146,42,0.02) 1px,transparent 1px),
    linear-gradient(90deg,rgba(201,146,42,0.02) 1px,transparent 1px);
  background-size:44px 44px;
  pointer-events:none;
  z-index:0;
}

/* iOS emoji defense — ensure liturgical glyphs render in text variant */
.glyph{font-variant-emoji:text;}

/* ─── PAGE ─────────────────────────────────────────────────── */
#app{
  max-width:var(--container-max-width);
  margin:0 auto;
  position:relative;
  z-index:1;
  padding:1rem 1rem 2rem;
}

/* fade-in on view switch */
.view{animation:view-fade 200ms ease-out;}
@keyframes view-fade{
  from{opacity:0;transform:translateY(4px);}
  to{opacity:1;transform:translateY(0);}
}
@media (prefers-reduced-motion: reduce){
  .view{animation:none;}
}

/* ─── HEADER (shared) ──────────────────────────────────────── */
.p-header{
  text-align:center;
  padding:2rem 0 1.5rem;
  position:relative;
}
.p-eyebrow{
  font-family:'Cinzel',serif;
  font-size:0.7rem;
  letter-spacing:0.28em;
  color:var(--text-eyebrow-2);
  text-transform:uppercase;
  margin-bottom:0.55rem;
}
.p-title{
  font-family:'Cinzel Decorative',serif;
  font-size:clamp(1.75rem,5.4vw,2.25rem);
  color:var(--gold-light);
  text-shadow:0 0 22px rgba(201,146,42,0.32);
  font-weight:400;
  line-height:1.15;
}
.p-title .glyph{
  color:var(--text-eyebrow);
  margin:0 0.45rem;
  font-size:0.85em;
  vertical-align:0.04em;
  letter-spacing:0;
}
.p-back{
  position:absolute;
  left:0;
  top:1.4rem;
  font-family:'Cinzel',serif;
  font-size:0.7rem;
  letter-spacing:0.16em;
  color:var(--text-eyebrow-2);
  text-transform:uppercase;
  padding:0.45rem 0.85rem;
  min-height:40px;
  display:inline-flex;
  align-items:center;
  border:1px solid rgba(201,146,42,0.25);
  border-radius:8px;
  background:transparent;
  cursor:pointer;
  font-variant-emoji:text;
}
.p-back:hover,.p-back:focus-visible{
  color:var(--gold-light);
  border-color:rgba(240,201,110,0.55);
}
.p-back .arrow{margin-right:0.4rem;font-size:0.95rem;line-height:1;}

/* ─── LANDING ──────────────────────────────────────────────── */
.landing-cards{
  display:grid;
  grid-template-columns:1fr;
  gap:1rem;
  margin-top:0.5rem;
}
@media (min-width:640px){
  .landing-cards{grid-template-columns:1fr 1fr;}
}
.rule-card{
  display:block;
  width:100%;
  text-align:left;
  background:linear-gradient(160deg,rgba(244,232,193,0.10),rgba(232,213,160,0.05));
  border:1.5px solid rgba(201,146,42,0.35);
  border-radius:14px;
  padding:1.4rem 1.4rem 1.3rem;
  cursor:pointer;
  transition:all 0.2s;
  font-family:inherit;
  color:inherit;
  position:relative;
  overflow:hidden;
}
.rule-card:hover,.rule-card:focus-visible{
  border-color:rgba(240,201,110,0.65);
  background:linear-gradient(160deg,rgba(244,232,193,0.14),rgba(232,213,160,0.08));
  transform:translateY(-1px);
}
.rule-card:active{transform:translateY(0);}
.rule-card .rc-icon{
  font-size:2rem;
  line-height:1;
  margin-bottom:0.5rem;
  display:block;
  font-variant-emoji:text;
}
.rule-card .rc-name{
  font-family:'Cinzel Decorative',serif;
  font-size:1.35rem;
  color:var(--gold-light);
  margin-bottom:0.3rem;
  font-weight:400;
  line-height:1.15;
}
.rule-card .rc-meta{
  font-family:'Crimson Text',serif;
  font-style:italic;
  font-size:0.95rem;
  color:var(--text-secondary);
  margin-bottom:1rem;
  line-height:1.4;
  min-height:1.4em;
}
.rule-card .rc-meta .rc-pip{
  display:inline-block;
  margin-left:0.4rem;
  color:var(--gold-light);
  font-style:normal;
  font-family:'Cinzel',serif;
  font-size:0.7rem;
  letter-spacing:0.14em;
  text-transform:uppercase;
}
.rule-card .rc-cta{
  display:inline-flex;
  align-items:center;
  gap:0.5rem;
  padding:0.55rem 1.15rem;
  min-height:42px;
  background:linear-gradient(135deg,var(--gold),var(--gold-bright));
  color:var(--bg);
  font-family:'Cinzel',serif;
  font-size:0.78rem;
  letter-spacing:0.18em;
  text-transform:uppercase;
  font-weight:700;
  border-radius:10px;
  box-shadow:0 4px 16px rgba(255,215,0,0.18);
}

/* Tertiary affordances row — Edit my routine / Prayer Book */
.tertiary-actions{
  display:flex;
  flex-wrap:wrap;
  gap:0.5rem 1.5rem;
  justify-content:center;
  align-items:center;
  margin-top:1.5rem;
  padding:0.5rem 0;
}
.tertiary-link{
  background:transparent;
  border:none;
  font-family:'Cinzel',serif;
  font-size:0.7rem;
  letter-spacing:0.2em;
  color:var(--text-eyebrow);
  text-transform:uppercase;
  cursor:pointer;
  padding:0.6rem 0.4rem;
  min-height:40px;
  position:relative;
  transition:color 0.2s;
}
.tertiary-link:hover,.tertiary-link:focus-visible{color:var(--gold-light);}
.tertiary-link::before{
  content:'\2726\FE0E';
  margin-right:0.5rem;
  color:rgba(201,146,42,0.55);
  font-variant-emoji:text;
}
.tertiary-link:hover::before,.tertiary-link:focus-visible::before{color:var(--gold-light);}

/* This-week summary */
.week-summary{
  margin-top:2rem;
  padding:1rem 1.25rem;
  text-align:center;
  border-top:1px solid rgba(201,146,42,0.15);
  border-bottom:1px solid rgba(201,146,42,0.15);
}
.week-summary .ws-eyebrow{
  font-family:'Cinzel',serif;
  font-size:0.62rem;
  letter-spacing:0.32em;
  color:var(--text-eyebrow-2);
  text-transform:uppercase;
  margin-bottom:0.35rem;
}
.week-summary .ws-line{
  font-family:'Crimson Text',serif;
  font-size:1rem;
  color:var(--text-primary);
  font-style:italic;
  line-height:1.5;
}
.week-summary .ws-line .glyph{
  color:var(--gold-light);
  margin:0 0.35rem;
}

/* ─── EDIT MODE ────────────────────────────────────────────── */
.edit-slot-toggle{
  display:flex;
  justify-content:center;
  gap:0.5rem;
  margin-bottom:1.75rem;
}
.edit-slot-tab{
  padding:0.55rem 1.4rem;
  min-height:42px;
  background:transparent;
  border:1px solid rgba(201,146,42,0.30);
  border-radius:22px;
  font-family:'Cinzel',serif;
  font-size:0.72rem;
  letter-spacing:0.2em;
  color:var(--text-eyebrow-2);
  text-transform:uppercase;
  cursor:pointer;
  transition:all 0.2s;
}
.edit-slot-tab:hover,.edit-slot-tab:focus-visible{
  border-color:rgba(240,201,110,0.7);
  color:var(--gold-light);
}
.edit-slot-tab.active{
  background:rgba(201,146,42,0.18);
  border-color:rgba(240,201,110,0.85);
  color:var(--gold-light);
  font-weight:600;
}

.edit-list{
  list-style:none;
  margin:0 0 1.5rem;
  padding:0;
}
.edit-row{
  display:flex;
  align-items:center;
  gap:0.75rem;
  padding:0.85rem 1rem;
  background:linear-gradient(160deg,rgba(244,232,193,0.07),rgba(232,213,160,0.03));
  border:1px solid rgba(201,146,42,0.22);
  border-radius:10px;
  margin-bottom:0.55rem;
}
.edit-row-pos{
  font-family:'Cinzel',serif;
  font-size:0.78rem;
  letter-spacing:0.06em;
  color:var(--text-eyebrow);
  min-width:1.4rem;
  text-align:center;
  font-variant-numeric:tabular-nums;
}
.edit-row-icon{
  font-size:1rem;
  color:var(--gold-light);
  font-variant-emoji:text;
}
.edit-row-name{
  flex:1;
  min-width:0;
  font-family:'Cinzel',serif;
  font-size:0.82rem;
  letter-spacing:0.08em;
  color:var(--text-primary);
  text-transform:uppercase;
  font-weight:600;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.edit-row-actions{
  display:flex;
  gap:0.3rem;
}
.edit-row-btn{
  width:38px;
  height:38px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  background:transparent;
  border:1px solid rgba(201,146,42,0.35);
  border-radius:8px;
  color:var(--text-eyebrow);
  font-family:'Cinzel',serif;
  font-size:0.85rem;
  cursor:pointer;
  transition:all 0.2s;
  font-variant-emoji:text;
}
.edit-row-btn:hover:not(:disabled),
.edit-row-btn:focus-visible:not(:disabled){
  border-color:rgba(240,201,110,0.7);
  color:var(--gold-light);
}
.edit-row-btn:disabled{opacity:0.32;cursor:not-allowed;}
.edit-row-btn.danger{color:rgba(252,165,165,0.85);border-color:rgba(252,165,165,0.28);}
.edit-row-btn.danger:hover{border-color:rgba(252,165,165,0.65);color:rgba(252,165,165,1);}

.edit-add-row{
  display:block;
  width:100%;
  padding:1rem 1.2rem;
  min-height:54px;
  background:transparent;
  border:1.5px dashed rgba(201,146,42,0.40);
  border-radius:12px;
  font-family:'Cinzel',serif;
  font-size:0.78rem;
  letter-spacing:0.18em;
  color:var(--gold-light);
  text-transform:uppercase;
  font-weight:600;
  cursor:pointer;
  transition:all 0.2s;
}
.edit-add-row:hover,.edit-add-row:focus-visible{
  border-color:rgba(240,201,110,0.85);
  background:rgba(201,146,42,0.08);
}

.edit-empty{
  text-align:center;
  padding:2rem 1rem;
  font-family:'Crimson Text',serif;
  font-style:italic;
  color:var(--text-secondary);
  font-size:0.95rem;
}

/* ─── PRAYER PICKER MODAL ──────────────────────────────────── */
.pk-overlay{
  position:fixed;inset:0;z-index:9998;
  background:rgba(11,14,22,0.96);
  backdrop-filter:blur(2px);
  -webkit-backdrop-filter:blur(2px);
  display:flex;align-items:flex-start;justify-content:center;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);
  opacity:0;
  transition:opacity 280ms ease-out;
  -webkit-tap-highlight-color:transparent;
  color:var(--text-primary);
  overflow:hidden;
}
.pk-overlay.pk-in{opacity:1;}
.pk-overlay.pk-out{opacity:0;}
.pk-card{
  width:100%;
  max-width:560px;
  max-height:100vh;
  height:100%;
  display:flex;
  flex-direction:column;
  background:
    linear-gradient(160deg,rgba(244,232,193,0.10),rgba(232,213,160,0.04)),
    var(--bg);
  border-left:1px solid rgba(201,146,42,0.18);
  border-right:1px solid rgba(201,146,42,0.18);
  box-shadow:0 14px 40px rgba(0,0,0,0.5);
}
@media (min-width:600px){
  .pk-card{
    height:auto;
    max-height:88vh;
    margin-top:5vh;
    border-radius:14px;
    border:1.5px solid rgba(201,146,42,0.45);
  }
}
.pk-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:1.1rem 1.2rem;
  border-bottom:1px solid rgba(201,146,42,0.18);
  flex-shrink:0;
}
.pk-title{
  font-family:'Cinzel',serif;
  font-size:0.78rem;
  letter-spacing:0.28em;
  color:var(--gold-light);
  text-transform:uppercase;
  font-weight:600;
}
.pk-close{
  width:42px;
  height:42px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  background:transparent;
  border:1px solid rgba(201,146,42,0.30);
  border-radius:50%;
  color:var(--text-eyebrow);
  font-size:1.1rem;
  cursor:pointer;
  transition:all 0.2s;
}
.pk-close:hover,.pk-close:focus-visible{
  color:var(--gold-light);
  border-color:rgba(240,201,110,0.65);
}
.pk-scroll{
  flex:1;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  padding:1rem 1.2rem 2rem;
}

.cat-section{margin-bottom:1.75rem;}
.cat-section:last-child{margin-bottom:0;}
.cat-header{
  font-family:'Cinzel',serif;
  font-size:0.7rem;
  letter-spacing:0.32em;
  color:var(--text-eyebrow);
  text-transform:uppercase;
  text-align:center;
  margin:1rem 0 0.85rem;
  padding-bottom:0.4rem;
  border-bottom:1px solid rgba(201,146,42,0.18);
}
.cat-section:first-child .cat-header{margin-top:0;}

.prayer-row{
  display:block;
  width:100%;
  text-align:left;
  background:linear-gradient(160deg,rgba(244,232,193,0.06),rgba(232,213,160,0.02));
  border:1px solid rgba(201,146,42,0.22);
  border-radius:10px;
  padding:0.95rem 1.1rem;
  margin-bottom:0.55rem;
  cursor:pointer;
  font-family:inherit;
  color:inherit;
  transition:all 0.2s;
}
.prayer-row:hover,.prayer-row:focus-visible{
  border-color:rgba(240,201,110,0.55);
  background:linear-gradient(160deg,rgba(244,232,193,0.10),rgba(232,213,160,0.04));
}
.prayer-row.muted{opacity:0.55;}
.prayer-row.muted:hover{opacity:0.85;}
.prayer-row.in-routine{
  border-color:rgba(240,201,110,0.55);
  background:linear-gradient(160deg,rgba(244,232,193,0.12),rgba(232,213,160,0.05));
}
.prayer-row .pr-row-top{
  display:flex;
  align-items:center;
  gap:0.65rem;
}
.prayer-row .pr-row-icon{
  font-size:1.1rem;
  line-height:1;
  color:var(--gold-light);
  font-variant-emoji:text;
}
.prayer-row .pr-row-name{
  font-family:'Cinzel',serif;
  font-size:0.82rem;
  letter-spacing:0.1em;
  color:var(--text-primary);
  text-transform:uppercase;
  font-weight:600;
  flex:1;
  min-width:0;
}
.prayer-row .pr-row-tag{
  font-family:'Cinzel',serif;
  font-size:0.55rem;
  letter-spacing:0.2em;
  color:var(--gold-light);
  text-transform:uppercase;
  padding:0.18rem 0.55rem;
  border:1px solid rgba(240,201,110,0.5);
  border-radius:10px;
  white-space:nowrap;
}
.prayer-row .pr-row-preview{
  margin-top:0.4rem;
  font-family:'Crimson Text',serif;
  font-style:italic;
  font-size:0.88rem;
  color:var(--text-tertiary);
  line-height:1.4;
  display:-webkit-box;
  -webkit-line-clamp:1;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
.prayer-row.expanded{
  background:linear-gradient(180deg,rgba(244,232,193,0.10),rgba(232,213,160,0.04));
  border-color:rgba(240,201,110,0.65);
}
.prayer-row.expanded .pr-row-preview{display:none;}
.prayer-row .pr-expand{
  display:none;
  margin-top:1rem;
  padding-top:1rem;
  border-top:1px dashed rgba(201,146,42,0.25);
}
.prayer-row.expanded .pr-expand{display:block;}
.prayer-row .pr-expand-text{
  font-family:'Crimson Text',serif;
  font-size:1rem;
  line-height:1.7;
  color:var(--text-primary);
}
.prayer-row .pr-expand-text p{margin-bottom:0.85rem;}
.prayer-row .pr-expand-text p:last-child{margin-bottom:0;}

.pr-actions{
  display:flex;
  flex-wrap:wrap;
  gap:0.4rem;
  margin-top:1rem;
}
.pr-action-btn{
  padding:0.5rem 0.95rem;
  min-height:42px;
  background:transparent;
  border:1px solid rgba(201,146,42,0.40);
  border-radius:8px;
  font-family:'Cinzel',serif;
  font-size:0.62rem;
  letter-spacing:0.18em;
  color:var(--text-eyebrow);
  text-transform:uppercase;
  cursor:pointer;
  transition:all 0.2s;
  font-variant-emoji:text;
}
.pr-action-btn:hover,.pr-action-btn:focus-visible{
  border-color:rgba(240,201,110,0.85);
  color:var(--gold-light);
}
.pr-action-btn.primary{
  background:linear-gradient(135deg,rgba(201,146,42,0.85),rgba(255,215,0,0.85));
  color:var(--bg);
  border-color:transparent;
  font-weight:700;
}
.pr-action-btn.primary:hover{filter:brightness(1.05);}
.pr-action-btn.added{
  color:var(--gold-light);
  border-color:rgba(240,201,110,0.55);
  background:rgba(201,146,42,0.10);
  cursor:default;
}

.muted-explainer{
  font-family:'Cinzel',serif;
  font-size:0.58rem;
  letter-spacing:0.2em;
  color:var(--text-eyebrow-2);
  text-transform:uppercase;
  margin-bottom:0.55rem;
  font-style:italic;
}

/* ─── PRAY MODE OVERLAY (Dispatch 11) ──────────────────────── */
/*
   Mirrors the Sunday Celebration overlay pattern (js/sunday-celebration.js
   _injectCSS) — full-viewport reverent surface, body scroll lock, fade in/
   out timing, prefers-reduced-motion respected. Author-clone (not shared
   module) per Q1 ruling: zero risk to launch-week Sunday Celebration code.
*/
.pm-overlay{
  position:fixed;inset:0;z-index:9999;
  background:rgba(11,14,22,0.978);
  background-image:
    radial-gradient(ellipse at 50% 0%,rgba(107,26,26,0.35) 0%,transparent 55%),
    radial-gradient(ellipse at 100% 100%,rgba(44,22,84,0.22) 0%,transparent 50%);
  backdrop-filter:blur(2px);
  -webkit-backdrop-filter:blur(2px);
  display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);
  opacity:0;
  transition:opacity 600ms ease-out;
  -webkit-tap-highlight-color:transparent;
  font-family:'Crimson Text','Times New Roman',serif;
  color:#F5ECD7;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}
.pm-overlay.pm-in{opacity:1;}
.pm-overlay.pm-out{opacity:0;transition-duration:280ms;}

.pm-topbar{
  display:flex;
  justify-content:flex-end;
  padding:0.85rem 1.1rem;
  flex-shrink:0;
}
.pm-close{
  width:42px;
  height:42px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  background:transparent;
  border:1px solid rgba(201,146,42,0.32);
  border-radius:50%;
  color:rgba(244,232,193,0.75);
  font-size:1.1rem;
  cursor:pointer;
  transition:all 0.2s;
}
.pm-close:hover,.pm-close:focus-visible{
  color:var(--gold-light);
  border-color:rgba(240,201,110,0.75);
}

.pm-scroll{
  flex:1;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  padding:1rem 1.25rem 1.5rem;
}
.pm-content{

<script>
'use strict';

/*
 * ═══════════════════════════════════════════════════════════════
 *   prayers.html — DISPATCH 11 REBUILD (May 11, 2026)
 *
 *   Two MODES on one route:
 *     PRAY MODE  — full-screen overlay, continuous prayer scroll,
 *                  "Amen — I prayed" self-attestation.
 *     EDIT MODE  — reorder + add/remove on the same surface; picker
 *                  modal exposes the 20-prayer pool (read-only in
 *                  landing context, with [+ Add] in edit context).
 *
 *   Landing carries two large CTAs (Pray Morning / Pray Evening)
 *   plus tertiary text affordances "Edit my routine" and
 *   "Prayer Book". No more Browse Prayers tile.
 *
 *   Canonical write paths preserved verbatim:
 *     recordRoutineCompletion(kind, missionKey) — mission_completions +
 *                                                  prayer_streak_weekly
 *     persistRoutine(kind, newIds)              — prayer_routines
 *
 *   See CHAT_11_COMPLETION_SUMMARY.md for the full change record.
 * ═══════════════════════════════════════════════════════════════
 */

// ──────────────────────────────────────────────────────────────────
// CONFIG
// ──────────────────────────────────────────────────────────────────
const SUPABASE_URL = 'https://ksfnsryfmkafwirzgjoe.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtzZm5zcnlmbWthZndpcnpnam9lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2ODM4MTcsImV4cCI6MjA5MTI1OTgxN30.mHQty44WBnjQY8BJ8KbPk_pp-yTcOaifGxCZPUO4xpY';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// Mission keys (pre-build verified: both rows exist, coins=0, repeatable=true,
// is_active=true). DO NOT modify the mission rows — Lane 2 zeroed
// per-completion coin drops; the Sunday rollup is the reward.
const MISSION_KEY_MORNING = 'daily_morning_prayer';
const MISSION_KEY_EVENING = 'daily_evening_prayer';

// Liturgical season heuristics — for launch we statically mute three prayers
// based on calendar windows. Per Dispatch 11 inheritance: "do not auto-detect
// dynamically." A future content lane should source these from the
// liturgical_calendar table; this is a launch-acceptable simplification.
const PASCHA_WINDOW_START = '2026-04-12';   // Pascha 2026
const PASCHA_WINDOW_END   = '2026-05-31';   // through Pentecost
const TODAY_ISO = (function(){
  const d = new Date();
  return d.getFullYear() + '-' +
    String(d.getMonth()+1).padStart(2,'0') + '-' +
    String(d.getDate()).padStart(2,'0');
})();
const IN_PASCHA_SEASON = TODAY_ISO >= PASCHA_WINDOW_START && TODAY_ISO <= PASCHA_WINDOW_END;
const IN_LENT          = false;   // Static at launch; not currently in Lent.

const CATEGORY_LABELS = {
  anytime:  'Anytime Prayers',
  morning:  'Morning Prayers',
  evening:  'Evening Prayers',
  patron:   'Patron Saints',
  special:  'Special Prayers',
  lent:     'Great Lent',
};
const CATEGORY_ORDER = ['anytime','morning','evening','patron','special','lent'];

// Per-prayer ornament glyph (each paired with U+FE0E for iOS text variant).
function iconFor(prayer){
  const map = {
    sign_of_cross:        '\u271D\uFE0E',
    trisagion:            '\u2726\uFE0E',
    lords_prayer:         '\u2629\uFE0E',
    jesus_prayer:         '\u2626\uFE0E',
    glory_be:             '\u2726\uFE0E',
    o_heavenly_king:      '\u2734\uFE0E',
    paschal_troparion:    '\u2734\uFE0E',
    morning_theotokos:    '\u2727\uFE0E',
    guardian_angel:       '\u2727\uFE0E',
    st_macarius_evening:  '\u263E\uFE0E',
    psalm_50_full:        '\u2735\uFE0E',
    psalm_50_short:       '\u2735\uFE0E',
    examination:          '\u2737\uFE0E',
    evening_theotokos:    '\u263E\uFE0E',
    phos_hilaron:         '\u263C\uFE0E',
    st_herman:            '\u2725\uFE0E',
    for_parents:          '\u2727\uFE0E',
    nicene_creed:         '\u2629\uFE0E',
    truly_meet:           '\u2727\uFE0E',
    st_ephrem:            '\u2725\uFE0E',
  };
  return map[prayer.slug] || '\u2726\uFE0E';
}

// ──────────────────────────────────────────────────────────────────
// STATE
// ──────────────────────────────────────────────────────────────────
const state = {
  view: 'landing',           // 'landing' | 'edit'
  editSlot: 'morning',       // 'morning' | 'evening' (which routine is open in edit)
  // data
  profileId: null,
  prayers: [],               // ordered by display_order
  prayersBySlug: {},
  prayersById:   {},
  routines: { morning:null, evening:null },
  thisWeek: { morning_count:0, evening_count:0, week_start_date:null },
  todayCompleted: { morning:false, evening:false },
};

// ──────────────────────────────────────────────────────────────────
// INIT
// ──────────────────────────────────────────────────────────────────
(async function main(){
  // 1. Auth (4s timeout — same pattern as week.html / quiz-runner.js)
  try{
    const timer = new Promise(r => setTimeout(()=>r(null), 4000));
    const res   = await Promise.race([sb.auth.getSession(), timer]);
    const session = res && res.data && res.data.session ? res.data.session : null;
    if(session) state.profileId = session.user.id;
  }catch(_){
    console.warn('Prayer: auth check failed; rendering library read-only.');
  }

  // 2. Load all active prayers (single query)
  try{
    const { data, error } = await sb
      .from('prayers')
      .select('*')
      .eq('is_active', true)
      .order('display_order', { ascending:true });
    if(error) throw error;
    state.prayers = data || [];
    state.prayers.forEach(p => {
      state.prayersBySlug[p.slug] = p;
      state.prayersById[p.id]     = p;
    });
  }catch(e){
    console.error('Prayer: failed to load prayers', e);
    document.getElementById('app').innerHTML =
      '<div class="error-block">The prayer book could not be opened. Please check your connection and try again.</div>';
    document.getElementById('bottom-nav').style.display='flex';
    return;
  }

  // 3. Load this explorer's routines (if signed in)
  if(state.profileId){
    try{
      const { data, error } = await sb
        .from('prayer_routines')
        .select('*')
        .eq('explorer_id', state.profileId);
      if(error) throw error;
      (data||[]).forEach(r => { state.routines[r.kind] = r; });
    }catch(e){
      console.warn('Prayer: failed to load routines', e);
    }
  }

  // 4. Run the Sunday-night rollup BEFORE we load the current-week row,
  //    so any newly-settled past-week rows don't get mis-displayed as
  //    "this week's progress." Awaited so the celebration renders before
  //    we paint the landing screen.
  if(state.profileId && window.PrayerRollup){
    try{ await window.PrayerRollup.run(sb, state.profileId); }
    catch(e){ console.warn('Prayer: rollup failed (non-fatal)', e); }
  }

  // 5. Load this week's streak counter row (or fall back to zeros)
  if(state.profileId){
    const weekStart = window.PrayerRollup
      ? window.PrayerRollup.getCurrentWeekStart(new Date())
      : computeWeekStart(new Date());
    const weekStartKey = window.PrayerRollup
      ? window.PrayerRollup.ymd(weekStart)
      : ymdLocal(weekStart);
    state.thisWeek.week_start_date = weekStartKey;
    try{
      const { data, error } = await sb
        .from('prayer_streak_weekly')
        .select('*')
        .eq('explorer_id', state.profileId)
        .eq('week_start_date', weekStartKey)
        .maybeSingle();
      if(error) throw error;
      if(data){
        state.thisWeek.morning_count = data.morning_count || 0;
        state.thisWeek.evening_count = data.evening_count || 0;
      }
    }catch(e){
      console.warn('Prayer: failed to load this-week streak', e);
    }
  }

  // 6. Check today's mission_completion to dedupe routine completion taps
  //    (Operational Learning #4 — query before assuming).
  if(state.profileId){
    await refreshTodayCompletions();
  }

  // 7. URL params — Dispatch 11 routing.
  //    ?pray=morning|evening  → auto-open Pray Mode for that slot (NEW canonical)
  //    ?time=morning|evening  → same as ?pray (back-compat for legacy callers
  //                              like home.html ?time= deep-links; tracked in
  //                              repo-audit chat for eventual cleanup)
  //    ?edit=morning|evening  → open Edit Mode pre-tabbed to that slot
  //    ?view=browse           → open Prayer Book picker (read-only) — back-compat
  const params = new URLSearchParams(window.location.search);
  const prayParam = params.get('pray') || params.get('time');
  const editParam = params.get('edit');
  const viewParam = params.get('view');

  render();

  if(prayParam === 'morning' || prayParam === 'evening'){
    if(state.routines[prayParam]){
      openPrayMode(prayParam);
    }
  } else if(editParam === 'morning' || editParam === 'evening'){
    state.view = 'edit';
    state.editSlot = editParam;
    render();
  } else if(viewParam === 'browse'){
    openPickerModal({ readOnly:true });
  }
})();

// ──────────────────────────────────────────────────────────────────
// RENDER (top-level dispatcher)
// ──────────────────────────────────────────────────────────────────
function render(){
  const root = document.getElementById('app');
  root.innerHTML = '';
  const view = document.createElement('div');
  view.className = 'view view-' + state.view;
  if(state.view === 'edit'){
    view.appendChild(renderEdit());
  } else {
    view.appendChild(renderLanding());
  }
  root.appendChild(view);
  showBottomNav(true);
  window.scrollTo(0, 0);
}

function showBottomNav(show){
  const nav = document.getElementById('bottom-nav');
  if(!nav) return;
  nav.style.display = show ? 'flex' : 'none';
  document.body.classList.toggle('no-nav', !show);
}

// ──────────────────────────────────────────────────────────────────
// VIEW: LANDING
// ──────────────────────────────────────────────────────────────────
function renderLanding(){
  const wrap = document.createElement('div');

  // Header
  const header = document.createElement('div');
  header.className = 'p-header';
  header.innerHTML =
    '<div class="p-eyebrow">Daily Prayer</div>' +
    '<h1 class="p-title"><span class="glyph">&#x2726;&#xFE0E;</span>Prayer<span class="glyph">&#x2726;&#xFE0E;</span></h1>';
  wrap.appendChild(header);

  // Two primary CTA cards — Morning Rule, Evening Rule
  const cards = document.createElement('div');
  cards.className = 'landing-cards';

  const morningCount = state.routines.morning && state.routines.morning.prayer_ids
    ? state.routines.morning.prayer_ids.length : 0;
  const eveningCount = state.routines.evening && state.routines.evening.prayer_ids
    ? state.routines.evening.prayer_ids.length : 0;

  cards.appendChild(makeRuleCard({
    slot:'morning',
    icon:'\uD83C\uDF05',                    // 🌅
    name:'Morning Rule',
    count: morningCount,
    completedToday: state.todayCompleted.morning,
  }));

  cards.appendChild(makeRuleCard({
    slot:'evening',
    icon:'\uD83C\uDF19',                    // 🌙
    name:'Evening Rule',
    count: eveningCount,
    completedToday: state.todayCompleted.evening,
  }));

  wrap.appendChild(cards);

  // Tertiary affordances — Edit my routine / Prayer Book
  const tertiary = document.createElement('div');
  tertiary.className = 'tertiary-actions';

  const editBtn = document.createElement('button');
  editBtn.type = 'button';
  editBtn.className = 'tertiary-link';
  editBtn.textContent = 'Edit my routine';
  editBtn.addEventListener('click', function(){
    state.view = 'edit';
    state.editSlot = state.todayCompleted.morning && !state.todayCompleted.evening ? 'evening' : 'morning';
    render();
  });
  tertiary.appendChild(editBtn);

  const bookBtn = document.createElement('button');
  bookBtn.type = 'button';
  bookBtn.className = 'tertiary-link';
  bookBtn.textContent = 'Prayer Book';
  bookBtn.addEventListener('click', function(){
    openPickerModal({ readOnly:true });
  });
  tertiary.appendChild(bookBtn);

  wrap.appendChild(tertiary);

  // This-week summary
  if(state.profileId){
    const m = state.thisWeek.morning_count;
    const e = state.thisWeek.evening_count;
    const summary = document.createElement('div');
    summary.className = 'week-summary';
    let line;
    if(m === 0 && e === 0){
      line = '<em>A new week of faithful prayer awaits.</em>';
    } else {
      line =
        '<span class="glyph">&#x2726;&#xFE0E;</span> ' +
        m + ' morning' + (m===1?'':'s') + ' &middot; ' +
        e + ' evening' + (e===1?'':'s') +
        ' this week';
    }
    summary.innerHTML =
      '<div class="ws-eyebrow">This Week</div>' +
      '<div class="ws-line">' + line + '</div>';
    wrap.appendChild(summary);
  }

  return wrap;
}

function makeRuleCard(opts){
  const empty = opts.count === 0;
  const ctaLabel = empty
    ? 'Set Up'
    : (opts.completedToday ? 'Pray again' : ('Pray ' + opts.slot.charAt(0).toUpperCase() + opts.slot.slice(1)));
  const meta = empty
    ? 'Tap to set up your ' + opts.slot + ' prayers'
    : opts.count + ' prayer' + (opts.count===1?'':'s') +
      (opts.completedToday ? '<span class="rc-pip">&#x2713; prayed today</span>' : '');

  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'rule-card';
  btn.innerHTML =
    '<span class="rc-icon glyph">' + opts.icon + '</span>' +
    '<div class="rc-name">' + escapeHtml(opts.name) + '</div>' +
    '<div class="rc-meta">' + meta + '</div>' +
    '<span class="rc-cta">' + escapeHtml(ctaLabel) + '</span>';
  btn.addEventListener('click', function(){
    if(empty){
      // No routine yet — drop the user into edit mode for that slot.
      state.view = 'edit';
      state.editSlot = opts.slot;
      render();
      return;
    }
    openPrayMode(opts.slot);
  });
  return btn;
}

// ──────────────────────────────────────────────────────────────────
// VIEW: EDIT MODE
// ──────────────────────────────────────────────────────────────────
function renderEdit(){
  const wrap = document.createElement('div');

  // Header with back to landing
  const header = document.createElement('div');
  header.className = 'p-header';
  header.innerHTML =
    '<button class="p-back" id="edit-back" type="button">' +
    '<span class="arrow">&larr;</span>Back</button>' +
    '<div class="p-eyebrow">Customize</div>' +
    '<h1 class="p-title"><span class="glyph">&#x2726;&#xFE0E;</span>Edit my routine<span class="glyph">&#x2726;&#xFE0E;</span></h1>';
  wrap.appendChild(header);

  // Slot toggle (Morning / Evening)
  const toggle = document.createElement('div');
  toggle.className = 'edit-slot-toggle';
  [{key:'morning',label:'Morning'},{key:'evening',label:'Evening'}].forEach(function(t){
    const tab = document.createElement('button');
    tab.type = 'button';
    tab.className = 'edit-slot-tab' + (state.editSlot === t.key ? ' active' : '');
    tab.textContent = t.label;
    tab.addEventListener('click', function(){
      if(state.editSlot === t.key) return;
      state.editSlot = t.key;
      render();
    });
    toggle.appendChild(tab);
  });
  wrap.appendChild(toggle);

  // Current routine list
  const routine = state.routines[state.editSlot];
  const prayerIds = (routine && routine.prayer_ids) ? routine.prayer_ids : [];

  if(prayerIds.length === 0){
    const empty = document.createElement('div');
    empty.className = 'edit-empty';
    empty.textContent = 'No prayers in this routine yet. Tap below to add one.';
    wrap.appendChild(empty);
  } else {
    const list = document.createElement('ul');
    list.className = 'edit-list';
    prayerIds.forEach(function(pid, idx){
      const prayer = state.prayersById[pid];
      if(!prayer) return;
      list.appendChild(makeEditRow(prayer, idx, prayerIds.length));
    });
    wrap.appendChild(list);
  }

  // Add-prayer button
  const addBtn = document.createElement('button');
  addBtn.type = 'button';
  addBtn.className = 'edit-add-row';
  addBtn.innerHTML = '+&nbsp;&nbsp;Add a prayer';
  addBtn.addEventListener('click', function(){
    openPickerModal({ readOnly:false, slot:state.editSlot });
  });
  wrap.appendChild(addBtn);

  // Wire back button after DOM mount
  setTimeout(function(){
    const back = document.getElementById('edit-back');
    if(back) back.addEventListener('click', function(){
      state.view = 'landing';
      render();
    });
  }, 0);

  return wrap;
}

function makeEditRow(prayer, idx, total){
  const row = document.createElement('li');
  row.className = 'edit-row';

  const pos = document.createElement('span');
  pos.className = 'edit-row-pos';
  pos.textContent = String(idx + 1);
  row.appendChild(pos);

  const icon = document.createElement('span');
  icon.className = 'edit-row-icon glyph';
  icon.textContent = iconFor(prayer);
  row.appendChild(icon);

  const name = document.createElement('span');
  name.className = 'edit-row-name';
  name.textContent = prayer.name;
  row.appendChild(name);

  const actions = document.createElement('span');
  actions.className = 'edit-row-actions';

  const upBtn = document.createElement('button');
  upBtn.type = 'button';
  upBtn.className = 'edit-row-btn';
  upBtn.setAttribute('aria-label','Move up');
  upBtn.innerHTML = '&uarr;';
  upBtn.disabled = (idx === 0);
  upBtn.addEventListener('click', function(){ moveInRoutine(state.editSlot, idx, -1); });
  actions.appendChild(upBtn);

  const dnBtn = document.createElement('button');
  dnBtn.type = 'button';
  dnBtn.className = 'edit-row-btn';
  dnBtn.setAttribute('aria-label','Move down');
  dnBtn.innerHTML = '&darr;';
  dnBtn.disabled = (idx === total - 1);
  dnBtn.addEventListener('click', function(){ moveInRoutine(state.editSlot, idx, +1); });
  actions.appendChild(dnBtn);

  const rmBtn = document.createElement('button');
  rmBtn.type = 'button';
  rmBtn.className = 'edit-row-btn danger';
  rmBtn.setAttribute('aria-label','Remove from routine');
  rmBtn.innerHTML = '&times;';
  rmBtn.addEventListener('click', function(){ removeFromRoutine(state.editSlot, prayer.id); });
  actions.appendChild(rmBtn);

  row.appendChild(actions);
  return row;
}

// ──────────────────────────────────────────────────────────────────
// PICKER MODAL — read-only Prayer Book OR add-prayer surface
// ──────────────────────────────────────────────────────────────────
// Single modal serves both contexts (Q8 ruling):
//   { readOnly:true }                  → "Prayer Book" mode, no [+ Add]
//   { readOnly:false, slot:'morning' } → "Add a prayer" mode
//
// Modal stays open for chained adds. Per Q4 ruling: tapping the same
// prayer twice consecutively auto-closes the modal (prevents accidental
// duplication if Nolan's finger slips).
let _pickerLastAdded = null;   // tracks last-added prayer.id for double-tap close
let _pickerExpandedSlug = null;

function openPickerModal(opts){
  opts = opts || {};
  const readOnly = !!opts.readOnly;
  const slot = opts.slot || null;

  _pickerLastAdded = null;
  _pickerExpandedSlug = null;

  // Build overlay
  const overlay = document.createElement('div');
  overlay.className = 'pk-overlay';
  overlay.setAttribute('role','dialog');
  overlay.setAttribute('aria-modal','true');
  overlay.setAttribute('aria-label', readOnly ? 'Prayer Book' : 'Add a prayer');

  const titleText = readOnly ? 'Prayer Book' : ('Add to ' + (slot === 'evening' ? 'Evening' : 'Morning'));

  overlay.innerHTML =
    '<div class="pk-card">' +
      '<div class="pk-header">' +
        '<div class="pk-title">' + escapeHtml(titleText) + '</div>' +
        '<button class="pk-close" id="pk-close" type="button" aria-label="Close">&times;</button>' +
      '</div>' +
      '<div class="pk-scroll" id="pk-scroll"></div>' +
    '</div>';

  document.body.appendChild(overlay);

  // Body scroll lock
  const priorOverflow = document.body.style.overflow;
  document.body.style.overflow = 'hidden';

  // Force reflow → fade in
  // eslint-disable-next-line no-unused-expressions
  overlay.offsetWidth;
  overlay.classList.add('pk-in');

  // Render content
  const scrollEl = overlay.querySelector('#pk-scroll');
  renderPickerContent(scrollEl, { readOnly: readOnly, slot: slot });

  // Close handling
  let closed = false;
  function closeModal(){
    if(closed) return;
    closed = true;
    window.removeEventListener('keydown', onKey);
    overlay.classList.remove('pk-in');
    overlay.classList.add('pk-out');
    document.body.style.overflow = priorOverflow || '';
    setTimeout(function(){
      if(overlay.parentNode) overlay.remove();
    }, 280);
  }
  function onKey(ev){
    if(ev.key === 'Escape'){
      ev.preventDefault();
      closeModal();
    }
  }
  window.addEventListener('keydown', onKey);

  const closeBtn = overlay.querySelector('#pk-close');
  if(closeBtn) closeBtn.addEventListener('click', closeModal);

  // Stash close fn on the overlay so re-renders can find it
  overlay._closePicker = closeModal;
}

function renderPickerContent(scrollEl, opts){
  scrollEl.innerHTML = '';
  const readOnly = !!opts.readOnly;
  const slot = opts.slot || null;

  // Group prayers by category
  const groups = {};
  CATEGORY_ORDER.forEach(function(c){ groups[c] = []; });
  state.prayers.forEach(function(p){
    if(!groups[p.category]) groups[p.category] = [];
    groups[p.category].push(p);
  });

  CATEGORY_ORDER.forEach(function(cat){
    const list = groups[cat] || [];
    if(list.length === 0) return;
    const section = document.createElement('div');
    section.className = 'cat-section';
    section.innerHTML = '<div class="cat-header">' + (CATEGORY_LABELS[cat] || cat) + '</div>';
    list.forEach(function(prayer){
      section.appendChild(makePickerRow(prayer, { readOnly: readOnly, slot: slot, scrollEl: scrollEl }));
    });
    scrollEl.appendChild(section);
  });
}

function makePickerRow(prayer, opts){
  const readOnly = !!opts.readOnly;
  const slot = opts.slot || null;
  const scrollEl = opts.scrollEl;

  const muted = isOutOfSeason(prayer);
  const inMorning = !!(state.routines.morning && state.routines.morning.prayer_ids
    && state.routines.morning.prayer_ids.indexOf(prayer.id) !== -1);
  const inEvening = !!(state.routines.evening && state.routines.evening.prayer_ids
    && state.routines.evening.prayer_ids.indexOf(prayer.id) !== -1);
  const inThisSlot = (slot === 'morning' && inMorning) || (slot === 'evening' && inEvening);
  const expanded   = _pickerExpandedSlug === prayer.slug;

  const row = document.createElement('button');
  row.type = 'button';
  row.className = 'prayer-row';
  if(muted)                       row.classList.add('muted');
  if(inMorning || inEvening)      row.classList.add('in-routine');
  if(expanded)                    row.classList.add('expanded');

  // Right-side end-slot in row-top: in add mode shows [+ Add] / Added pip;
  // in read-only mode shows the routine tag if the prayer is in any routine.
  let endSlot = '';
  if(!readOnly && slot){
    if(inThisSlot){
      endSlot = '<button class="pr-action-btn added" type="button" disabled>&#x2713; Added</button>';
    } else {
      endSlot = '<button class="pr-action-btn primary" data-action="add" data-slug="' + escapeHtml(prayer.slug) + '" type="button">+ Add</button>';
    }
  } else if(readOnly){
    if(inMorning && inEvening) endSlot = '<span class="pr-row-tag">Morning &middot; Evening</span>';
    else if(inMorning)         endSlot = '<span class="pr-row-tag">Morning Rule</span>';
    else if(inEvening)         endSlot = '<span class="pr-row-tag">Evening Rule</span>';
  }

  const preview = previewOf(prayer.text);
  const mutedNote = muted ? '<div class="muted-explainer">Out of season &mdash; shown for reference</div>' : '';

  row.innerHTML =
    '<div class="pr-row-top">' +
    '<span class="pr-row-icon">' + iconFor(prayer) + '</span>' +
    '<span class="pr-row-name">' + escapeHtml(prayer.name) + '</span>' +
    endSlot +
    '</div>' +
    '<div class="pr-row-preview">' + escapeHtml(preview) + '</div>' +
    '<div class="pr-expand">' +
      mutedNote +
      '<div class="pr-expand-text">' + formatPrayerText(prayer.text) + '</div>' +
    '</div>';

  // Tap row body → expand/collapse (does NOT trigger add — action button has its own handler)
  row.addEventListener('click', function(ev){
    const inAction = ev.target.closest('.pr-action-btn');
    if(inAction) return;
    _pickerExpandedSlug = (_pickerExpandedSlug === prayer.slug) ? null : prayer.slug;
    renderPickerContent(scrollEl, { readOnly: readOnly, slot: slot });
  });

  // Wire the [+ Add] handler if present (visible in row-top, not behind expand)
  if(!readOnly && slot){
    setTimeout(function(){
      const addBtn = row.querySelector('[data-action="add"]');
      if(addBtn){
        addBtn.addEventListener('click', function(ev){
          ev.stopPropagation();
          handlePickerAdd(prayer, slot, scrollEl, readOnly);
        });
      }
    }, 0);
  }

  return row;
}

async function handlePickerAdd(prayer, slot, scrollEl, readOnly){
  // Per Q4: double-tap on the same prayer auto-closes the modal.
  if(_pickerLastAdded === prayer.id){
    // Already just added this one — close the modal.
    const overlay = document.querySelector('.pk-overlay');
    if(overlay && typeof overlay._closePicker === 'function'){
      overlay._closePicker();
    }
    return;
  }
  _pickerLastAdded = prayer.id;
  await addToRoutine(slot, prayer.id);   // persists + bumps state.routines
  // Re-render picker so the row flips to "Added ✓" state
  renderPickerContent(scrollEl, { readOnly: readOnly, slot: slot });
}

// ──────────────────────────────────────────────────────────────────
// PRAY MODE OVERLAY — full-screen continuous prayer
// ──────────────────────────────────────────────────────────────────
// Mirrors Sunday Celebration overlay pattern (Q1: clone, not shared module).
// Self-attestation via "Amen — I prayed" → recordRoutineCompletion (Q5/Q6).
// Closes without crediting if user dismisses without tapping Amen (Q6).

function openPrayMode(slot){
  const routine = state.routines[slot];
  if(!routine || !routine.prayer_ids || routine.prayer_ids.length === 0){
    // Defensive: shouldn't happen because landing routes empty routines
    // into edit mode, but if a deep-link lands here with no routine,
    // fall through to edit.
    state.view = 'edit';
    state.editSlot = slot;
    render();
    return;
  }

  // Build overlay
  const overlay = document.createElement('div');
  overlay.className = 'pm-overlay';
  overlay.setAttribute('role','dialog');
  overlay.setAttribute('aria-modal','true');
  overlay.setAttribute('aria-label', slot === 'evening' ? 'Evening Rule' : 'Morning Rule');

  // Build the continuous content — eyebrow + (title, body)* alternation
  const eyebrowText = (slot === 'evening' ? '\u2726\uFE0E   Evening Rule   \u2726\uFE0E' : '\u2726\uFE0E   Morning Rule   \u2726\uFE0E');
  let contentHtml = '<div class="pm-eyebrow glyph">' + eyebrowText + '</div>';
  routine.prayer_ids.forEach(function(pid){
    const prayer = state.prayersById[pid];
    if(!prayer) return;
    contentHtml +=
      '<div class="pm-prayer-title">' + escapeHtml(prayer.name) + '</div>' +
      '<div class="pm-prayer-body">' + formatPrayerText(prayer.text) + '</div>';
  });

  overlay.innerHTML =
    '<div class="pm-topbar">' +
      '<button class="pm-close" id="pm-close" type="button" aria-label="Close">&times;</button>' +
    '</div>' +
    '<div class="pm-scroll" id="pm-scroll">' +
      '<div class="pm-content">' + contentHtml + '</div>' +
    '</div>' +
    '<div class="pm-actions" id="pm-actions">' +
      '<button class="pm-amen-btn glyph" id="pm-amen" type="button">Amen \u2014 I prayed</button>' +
    '</div>';

  document.body.appendChild(overlay);

  // Lock body scroll
  const priorOverflow = document.body.style.overflow;
  document.body.style.overflow = 'hidden';

  // Force reflow → fade in
  // eslint-disable-next-line no-unused-expressions
  overlay.offsetWidth;
  overlay.classList.add('pm-in');

  // Reset the scroll inside the overlay to top
  const scrollEl = overlay.querySelector('#pm-scroll');
  if(scrollEl) scrollEl.scrollTop = 0;

  let closed = false;
  let amenInProgress = false;

  function closeOverlay(immediate){
    if(closed) return;
    closed = true;
    window.removeEventListener('keydown', onKey);
    overlay.classList.remove('pm-in');
    overlay.classList.add('pm-out');
    document.body.style.overflow = priorOverflow || '';
    setTimeout(function(){
      if(overlay.parentNode) overlay.remove();
    }, immediate ? 80 : 320);
  }
  function onKey(ev){
    if(ev.key === 'Escape'){
      ev.preventDefault();
      closeOverlay(false);   // Q6: no credit on dismiss
    }
  }
  window.addEventListener('keydown', onKey);

  const closeBtn = overlay.querySelector('#pm-close');
  if(closeBtn) closeBtn.addEventListener('click', function(){
    closeOverlay(false);     // Q6: no credit on dismiss
  });

  // Amen handler — record completion, show reverent confirmation, fade.
  const amenBtn = overlay.querySelector('#pm-amen');
  if(amenBtn) amenBtn.addEventListener('click', async function(){
    if(amenInProgress) return;
    amenInProgress = true;
    amenBtn.disabled = true;

    // Fire the canonical write path (existing, not rebuilt — Q5 lock).
    const missionKey = (slot === 'morning') ? MISSION_KEY_MORNING : MISSION_KEY_EVENING;
    if(state.profileId){
      try{
        await recordRoutineCompletion(slot, missionKey);
      }catch(e){
        console.warn('Prayer: routine record failed (non-fatal):', e);
      }
    }

    // Slide in the reverent "Glory to God." confirmation.
    showGloryConfirmation(overlay, function(){
      // After ~1.4s of reverent moment, fade overlay out and re-render
      // landing so the "✓ prayed today" pip + "Pray again" CTA show.
      closeOverlay(false);
      render();
    });
  });
}

// Reverent confirmation styled per Q5 ruling — Cinzel, parchment-gold,
// centered. NOT a system toast.
function showGloryConfirmation(overlay, onComplete){
  // Hide the action bar (where the Amen button lived) and the scroll
  // content; the gentle overlay-internal "glory" layer replaces them.
  const actions = overlay.querySelector('#pm-actions');
  const scroll  = overlay.querySelector('#pm-scroll');
  if(actions) actions.style.opacity = '0';
  if(scroll)  scroll.style.opacity  = '0';

  const glory = document.createElement('div');
  glory.className = 'pm-glory';
  glory.innerHTML =
    '<div class="pm-glory-mark glyph">\u2726\uFE0E   \u2726\uFE0E   \u2726\uFE0E</div>' +
    '<div class="pm-glory-text">&ldquo;Glory to God.&rdquo;</div>';
  overlay.appendChild(glory);

  // Force reflow → fade in
  // eslint-disable-next-line no-unused-expressions
  glory.offsetWidth;
  glory.classList.add('pm-glory-in');

  setTimeout(function(){
    if(typeof onComplete === 'function') onComplete();
  }, 1400);
}

// ──────────────────────────────────────────────────────────────────
// COMPLETION + STREAK (preserved canonical write path — DO NOT REBUILD)
// ──────────────────────────────────────────────────────────────────
//
// Dedupe rule: one Morning Rule per day counts toward the streak.
// Second tap on the same day silently no-ops on the streak counter AND
// skips re-recording the mission_completion. coins_awarded = 0 (Lane 2).
async function recordRoutineCompletion(kind, missionKey){
  const mRes = await sb
    .from('missions')
    .select('id, key, coins')
    .eq('key', missionKey)
    .single();
  if(mRes.error || !mRes.data){
    console.warn('Prayer: mission not found for key', missionKey, mRes.error);
    return { ok:false, reason:'mission-missing' };
  }
  const missionId = mRes.data.id;
  const todayKey = window.PrayerRollup
    ? window.PrayerRollup.ymd(new Date())
    : ymdLocal(new Date());

  // Already completed today? No-op the streak bump.
  const dupRes = await sb
    .from('mission_completions')
    .select('id')
    .eq('explorer_id', state.profileId)
    .eq('mission_id', missionId)
    .eq('day_key', todayKey)
    .eq('status', 'completed')
    .limit(1);
  if(dupRes.error){
    console.warn('Prayer: dedupe query failed (proceeding without dedupe):', dupRes.error);
  }
  const alreadyDone = !dupRes.error && dupRes.data && dupRes.data.length > 0;

  if(alreadyDone){
    state.todayCompleted[kind] = true;
    return { ok:true, deduped:true };
  }

  // Insert mission_completion. coins_awarded = 0 per Lane 2.
  const insRes = await sb
    .from('mission_completions')
    .insert({
      explorer_id:   state.profileId,
      mission_id:    missionId,
      status:        'completed',
      day_key:       todayKey,
      completed_at:  new Date().toISOString(),
      coins_awarded: 0,
      notes:         'auto-marked by routine completion',
    });
  if(insRes.error){
    console.warn('Prayer: mission_completion insert failed:', insRes.error);
  }

  // UPSERT this week's streak counter (+1 to morning_count or evening_count).
  const weekStart = window.PrayerRollup
    ? window.PrayerRollup.getCurrentWeekStart(new Date())
    : computeWeekStart(new Date());
  const weekStartKey = window.PrayerRollup
    ? window.PrayerRollup.ymd(weekStart)
    : ymdLocal(weekStart);

  const existRes = await sb
    .from('prayer_streak_weekly')
    .select('*')
    .eq('explorer_id', state.profileId)
    .eq('week_start_date', weekStartKey)
    .maybeSingle();
  if(existRes.error){
    console.warn('Prayer: streak read failed:', existRes.error);
    state.todayCompleted[kind] = true;
    return { ok:false, reason:'streak-read-failed' };
  }

  if(existRes.data){
    const incField = (kind === 'morning') ? 'morning_count' : 'evening_count';
    const newVal = (existRes.data[incField] || 0) + 1;
    const upd = {};
    upd[incField] = newVal;
    const updRes = await sb
      .from('prayer_streak_weekly')
      .update(upd)
      .eq('id', existRes.data.id);
    if(updRes.error){
      console.warn('Prayer: streak increment failed:', updRes.error);
    } else {
      if(kind === 'morning') state.thisWeek.morning_count = newVal;
      else                   state.thisWeek.evening_count = newVal;
    }
  } else {
    const insertRow = {
      explorer_id:     state.profileId,
      week_start_date: weekStartKey,
      morning_count:   kind === 'morning' ? 1 : 0,
      evening_count:   kind === 'evening' ? 1 : 0,
    };
    const insRowRes = await sb
      .from('prayer_streak_weekly')
      .insert(insertRow);
    if(insRowRes.error){
      // Race fallback: another tab may have just created the row.
      console.warn('Prayer: streak insert failed, retrying via update:', insRowRes.error);
      const retry = await sb
        .from('prayer_streak_weekly')
        .select('*')
        .eq('explorer_id', state.profileId)
        .eq('week_start_date', weekStartKey)
        .maybeSingle();
      if(retry.data){
        const incField = (kind === 'morning') ? 'morning_count' : 'evening_count';
        const newVal = (retry.data[incField] || 0) + 1;
        const upd = {};
        upd[incField] = newVal;
        await sb
          .from('prayer_streak_weekly')
          .update(upd)
          .eq('id', retry.data.id);
        if(kind === 'morning') state.thisWeek.morning_count = newVal;
        else                   state.thisWeek.evening_count = newVal;
      }
    } else {
      if(kind === 'morning') state.thisWeek.morning_count = 1;
      else                   state.thisWeek.evening_count = 1;
    }
  }

  state.todayCompleted[kind] = true;
  return { ok:true };
}

async function refreshTodayCompletions(){
  const todayKey = window.PrayerRollup
    ? window.PrayerRollup.ymd(new Date())
    : ymdLocal(new Date());
  try{
    const mRes = await sb
      .from('missions')
      .select('id, key')
      .in('key', [MISSION_KEY_MORNING, MISSION_KEY_EVENING]);
    if(mRes.error || !mRes.data) return;
    const idByKey = {};
    mRes.data.forEach(function(m){ idByKey[m.key] = m.id; });
    const ids = Object.values(idByKey);
    if(ids.length === 0) return;
    const cRes = await sb
      .from('mission_completions')
      .select('mission_id')
      .eq('explorer_id', state.profileId)
      .eq('status','completed')
      .eq('day_key', todayKey)
      .in('mission_id', ids);
    if(cRes.error || !cRes.data) return;
    const completedSet = new Set(cRes.data.map(function(c){ return c.mission_id; }));
    state.todayCompleted.morning = completedSet.has(idByKey[MISSION_KEY_MORNING]);
    state.todayCompleted.evening = completedSet.has(idByKey[MISSION_KEY_EVENING]);
  }catch(e){
    console.warn('Prayer: today-completions refresh failed:', e);
  }
}

// ──────────────────────────────────────────────────────────────────
// ROUTINE EDITS (preserved canonical write path — DO NOT REBUILD)
// ──────────────────────────────────────────────────────────────────
async function addToRoutine(kind, prayerId){
  const existing = state.routines[kind];
  let newIds;
  if(existing){
    if(existing.prayer_ids.indexOf(prayerId) !== -1) return;
    newIds = existing.prayer_ids.concat([prayerId]);
  } else {
    newIds = [prayerId];
  }
  await persistRoutine(kind, newIds);
}

async function removeFromRoutine(kind, prayerId){
  const existing = state.routines[kind];
  if(!existing) return;
  const newIds = existing.prayer_ids.filter(function(id){ return id !== prayerId; });
  await persistRoutine(kind, newIds);
}

async function moveInRoutine(kind, idx, dir){
  const existing = state.routines[kind];
  if(!existing) return;
  const ids = existing.prayer_ids.slice();
  const ni = idx + dir;
  if(ni < 0 || ni >= ids.length) return;
  const tmp = ids[idx]; ids[idx] = ids[ni]; ids[ni] = tmp;
  await persistRoutine(kind, ids);
}

async function persistRoutine(kind, newIds){
  if(!state.profileId) return;
  try{
    const existing = state.routines[kind];
    if(existing){
      const { error } = await sb
        .from('prayer_routines')
        .update({ prayer_ids: newIds, updated_at: new Date().toISOString() })
        .eq('id', existing.id);
      if(error) throw error;
      existing.prayer_ids = newIds;
    } else {
      const { data, error } = await sb
        .from('prayer_routines')
        .insert({ explorer_id: state.profileId, kind: kind, prayer_ids: newIds })
        .select()
        .single();
      if(error) throw error;
      state.routines[kind] = data;
    }
  }catch(e){
    console.error('Prayer: routine persist failed', e);
  }
  // Re-render the current view (edit mode list update) AND, if the
  // picker modal is open, re-render its content so [+ Add]/Added pips
  // flip correctly. The picker re-renders itself in handlePickerAdd
  // for chained-add latency; we only need to re-render the edit view
  // here for remove/reorder.
  if(state.view === 'edit'){
    render();
  }
}

// ──────────────────────────────────────────────────────────────────
// HELPERS
// ──────────────────────────────────────────────────────────────────
function isOutOfSeason(prayer){
  // Heuristic: muting is static, three known cases.
  if(prayer.slug === 'paschal_troparion') return !IN_PASCHA_SEASON;
  if(prayer.slug === 'o_heavenly_king')   return  IN_PASCHA_SEASON;
  if(prayer.slug === 'st_ephrem')         return !IN_LENT;
  return false;
}

function formatPrayerText(text){
  // Split on blank lines into paragraphs; preserve single newlines as spaces.
  const paras = (text || '').split(/\n\s*\n/);
  return paras.map(function(p){
    return '<p>' + escapeHtml(p).replace(/\n/g,' ') + '</p>';
  }).join('');
}

function previewOf(text){
  if(!text) return '';
  const first = (text.split(/\n\s*\n/)[0] || '').replace(/\s+/g,' ').trim();
  if(first.length <= 110) return first;
  const slice = first.slice(0, 110);
  const lastSpace = slice.lastIndexOf(' ');
  return (lastSpace > 60 ? slice.slice(0, lastSpace) : slice) + '...';
}

function escapeHtml(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

// Sunday-anchor week helpers (Dispatch 2). Fallback path mirrors
// WeekUtils.getWeekStart / WeekUtils.ymd in case window.WeekUtils
// hasn't loaded — ET-aware and stable across timezones.
function computeWeekStart(d){
  if (window.WeekUtils) return window.WeekUtils.getWeekStart(d);
  const out = new Date(d);
  out.setHours(0,0,0,0);
  const dow = out.getDay();
  if (dow !== 0) out.setDate(out.getDate() - dow);
  return out;
}
function ymdLocal(d){
  if (window.WeekUtils) return window.WeekUtils.ymd(d);
  return d.getFullYear() + '-' +
    String(d.getMonth()+1).padStart(2,'0') + '-' +
    String(d.getDate()).padStart(2,'0');
}

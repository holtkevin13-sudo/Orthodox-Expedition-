<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="css/viewport.css">
<link rel="stylesheet" href="css/contrast.css">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>This Week — The Orthodox Expedition</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Caveat:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --gold:#c9922a;
  --gold-light:#f0c96e;
  --gold-bright:#ffd700;
  --parchment:#f4e8c1;
  --ink:#1a0f00;
  --burgundy:#6b1a1a;
  --byzantine:#2c1654;
  --bg:#0e0800;
  --green:#16a34a;
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{min-height:100%;overflow-x:hidden;}
body{
  font-family:'Crimson Text',serif;
  background:var(--bg);
  background-image:
    radial-gradient(ellipse at 50% 0%,rgba(107,26,26,0.5) 0%,transparent 55%),
    radial-gradient(ellipse at 100% 100%,rgba(44,22,84,0.35) 0%,transparent 50%);
  min-height:100vh;
  color:var(--parchment);
  padding:1rem 1rem 4rem;
}
body::before{
  content:'';
  position:fixed;
  inset:0;
  background-image:
    linear-gradient(rgba(201,146,42,0.02) 1px,transparent 1px),
    linear-gradient(90deg,rgba(201,146,42,0.02) 1px,transparent 1px);
  background-size:44px 44px;
  pointer-events:none;
  z-index:0;
}

.container{
  max-width:var(--container-max-width);
  margin:0 auto;
  position:relative;
  z-index:1;
}

/* HEADER */
.header{text-align:center;padding:1.5rem 0 1rem;border-bottom:1px solid rgba(201,146,42,0.15);margin-bottom:2rem;}
.greeting{font-family:'Cinzel',serif;font-size:0.7rem;letter-spacing:0.25em;color:rgba(240,201,110,0.7);text-transform:uppercase;margin-bottom:0.4rem;}
.day-name{font-family:'Cinzel Decorative',serif;font-size:clamp(1.4rem,5vw,1.9rem);color:var(--gold-light);text-shadow:0 0 18px rgba(201,146,42,0.35);margin-bottom:0.15rem;}
.full-date{font-family:'Crimson Text',serif;font-style:italic;font-size:0.95rem;color:rgba(244,232,193,0.55);margin-bottom:0.75rem;}
.liturgical-context{margin-top:0.5rem;margin-bottom:0;text-align:left;}
.liturgical-context:empty{display:none;}
.session-title{font-family:'Cinzel Decorative',serif;font-size:clamp(1rem,3.5vw,1.25rem);color:var(--parchment);margin-bottom:0.25rem;padding:0 1rem;}
.session-week{font-family:'Cinzel',serif;font-size:0.65rem;letter-spacing:0.2em;color:rgba(240,201,110,0.7);text-transform:uppercase;}

/* DAY TABS */
.day-tabs{display:flex;justify-content:center;gap:0.4rem;margin-bottom:2rem;flex-wrap:wrap;}
.day-tab{padding:0.5rem 1rem;min-width:110px;min-height:48px;background:rgba(44,22,84,0.18);border:1px solid rgba(201,146,42,0.18);border-radius:10px;font-family:'Cinzel',serif;font-size:0.7rem;letter-spacing:0.1em;color:rgba(240,201,110,0.7);text-transform:uppercase;cursor:default;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.3;}
.day-tab .day-label{font-size:0.62rem;color:rgba(240,201,110,0.65);}
.day-tab.active{background:rgba(107,26,26,0.35);border-color:rgba(240,201,110,0.85);color:var(--gold-bright);box-shadow:0 0 16px rgba(255,215,0,0.15);}
.day-tab.active .day-label{color:rgba(255,215,0,0.6);}

/* MAIN FRAME */
.main-frame{background:linear-gradient(160deg,rgba(244,232,193,0.04),rgba(244,232,193,0.01));border:1.5px solid rgba(201,146,42,0.18);border-radius:16px;padding:2rem 1.5rem;margin-bottom:1.5rem;}
.day-heading{font-family:'Cinzel Decorative',serif;font-size:1.3rem;color:var(--gold-light);margin-bottom:0.25rem;text-align:center;}
.day-subheading{font-family:'Cinzel',serif;font-size:0.65rem;letter-spacing:0.2em;color:rgba(240,201,110,0.7);text-transform:uppercase;margin-bottom:1.5rem;text-align:center;}

/* ARTIFACT SLOTS */
.artifact-slot{margin-bottom:1.25rem;padding:1.25rem;background:rgba(14,8,0,0.4);border:1px solid rgba(201,146,42,0.12);border-radius:10px;position:relative;}
.artifact-slot.placeholder::before{content:'AWAITING CONTENT';position:absolute;top:0.5rem;right:0.75rem;font-family:'Cinzel',serif;font-size:0.55rem;letter-spacing:0.2em;color:rgba(240,201,110,0.65);}
.artifact-icon{font-size:1.5rem;color:var(--gold);margin-bottom:0.4rem;}
.artifact-title{font-family:'Cinzel Decorative',serif;font-size:1.05rem;color:var(--gold-light);margin-bottom:0.25rem;}
.artifact-blurb{font-size:0.88rem;color:rgba(244,232,193,0.55);line-height:1.5;font-style:italic;}

/* COMPLETE BUTTON */
.complete-btn{display:block;width:100%;padding:0.875rem;margin-top:1rem;background:linear-gradient(135deg,var(--gold),var(--gold-bright));border:none;border-radius:12px;font-family:'Cinzel',serif;font-size:0.8rem;letter-spacing:0.15em;color:var(--bg);font-weight:700;cursor:pointer;text-transform:uppercase;min-height:52px;opacity:0.4;cursor:not-allowed;}
.complete-btn[data-ready="true"]{opacity:1;cursor:pointer;box-shadow:0 4px 18px rgba(255,215,0,0.2);}

/* SIDEBAR */
.sidebar{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:2rem;}
@media(max-width:520px){.sidebar{grid-template-columns:1fr;}}
.side-card{padding:1.25rem;background:rgba(44,22,84,0.12);border:1px solid rgba(201,146,42,0.12);border-radius:12px;}
.side-eyebrow{font-family:'Cinzel',serif;font-size:0.6rem;letter-spacing:0.2em;color:rgba(240,201,110,0.7);text-transform:uppercase;margin-bottom:0.5rem;}
.side-content{font-size:0.9rem;color:rgba(244,232,193,0.65);line-height:1.5;}
.side-content em{color:rgba(240,201,110,0.85);font-style:italic;}

/* PRAYER PANEL */
.prayer-panel{margin-bottom:1.5rem;padding:1.25rem 1.5rem;background:rgba(44,22,84,0.18);border:1px solid rgba(201,146,42,0.18);border-radius:12px;}
.prayer-panel-eyebrow{font-family:'Cinzel',serif;font-size:0.7rem;letter-spacing:0.2em;color:rgba(240,201,110,0.7);text-transform:uppercase;margin-bottom:0.875rem;text-align:center;}
.prayer-panel-row{display:flex;gap:0.875rem;flex-wrap:wrap;}
.prayer-link{display:flex;align-items:center;gap:0.6rem;flex:1;min-width:200px;padding:0.875rem 1rem;background:rgba(14,8,0,0.4);border:1px solid rgba(201,146,42,0.18);border-radius:10px;text-decoration:none;font-family:'Cinzel',serif;font-size:0.78rem;letter-spacing:0.05em;color:rgba(244,232,193,0.7);min-height:48px;transition:all 0.15s;}
.prayer-link:hover{border-color:rgba(240,201,110,0.7);color:var(--gold-light);}
.prayer-link.done{background:rgba(22,163,74,0.1);border-color:rgba(22,163,74,0.3);color:rgba(134,239,172,0.85);}
.prayer-link .prayer-mark{font-size:1.3rem;color:rgba(240,201,110,0.85);}
.prayer-link.done .prayer-mark{color:rgba(134,239,172,0.9);}
.prayer-panel-streak{margin-top:0.875rem;padding-top:0.875rem;border-top:1px solid rgba(201,146,42,0.12);font-family:'Caveat',cursive;font-size:1.05rem;color:rgba(240,201,110,0.85);text-align:center;}

/* BOTTOM NAV */
.bottom-nav{display:flex;justify-content:center;gap:1rem;padding-top:1.5rem;border-top:1px solid rgba(201,146,42,0.15);flex-wrap:wrap;}
.bottom-nav a{font-family:'Cinzel',serif;font-size:0.7rem;letter-spacing:0.15em;color:rgba(240,201,110,0.7);text-decoration:none;text-transform:uppercase;padding:0.5rem 0.875rem;min-height:40px;display:inline-flex;align-items:center;border:1px solid rgba(201,146,42,0.15);border-radius:8px;}
.bottom-nav a:hover{color:var(--gold-light);border-color:rgba(240,201,110,0.65);}

/* PRE-LAUNCH */
.pre-launch{text-align:center;padding:3rem 1.5rem;max-width:480px;margin:2rem auto;}
.pre-launch .icon{font-size:3rem;color:var(--gold);text-shadow:0 0 20px rgba(255,215,0,0.4);margin-bottom:1rem;}
.pre-launch h2{font-family:'Cinzel Decorative',serif;font-size:1.7rem;color:var(--gold-light);margin-bottom:0.5rem;}
.pre-launch .when{font-family:'Cinzel',serif;font-size:0.95rem;color:var(--gold-bright);letter-spacing:0.1em;margin:1rem 0;}
.pre-launch p{color:rgba(244,232,193,0.65);line-height:1.6;font-style:italic;margin-bottom:1rem;}

/* CALM FRAMES (Sun/Sat/between) */
.calm-frame{text-align:center;padding:2.5rem 1.5rem;background:linear-gradient(160deg,rgba(244,232,193,0.04),rgba(244,232,193,0.01));border:1.5px solid rgba(201,146,42,0.15);border-radius:16px;margin-bottom:1.5rem;}
.calm-icon{font-size:2.5rem;color:var(--gold);margin-bottom:0.75rem;text-shadow:0 0 20px rgba(201,146,42,0.3);}
.calm-title{font-family:'Cinzel Decorative',serif;font-size:1.4rem;color:var(--gold-light);margin-bottom:0.5rem;}
.calm-text{font-size:1rem;color:rgba(244,232,193,0.7);line-height:1.6;max-width:420px;margin:0 auto;}
.calm-quote{font-family:'Caveat',cursive;font-size:1.15rem;color:rgba(240,201,110,0.85);margin-top:1.25rem;font-style:italic;}

/* SAINT BANNER */
.saint-banner{display:flex;align-items:center;gap:1rem;padding:1rem 1.25rem;background:rgba(107,26,26,0.18);border:1px solid rgba(201,146,42,0.2);border-radius:12px;margin-bottom:1.5rem;}
.saint-banner .saint-icon{width:54px;height:54px;border-radius:50%;background:rgba(44,22,84,0.5);border:2px solid rgba(201,146,42,0.3);display:flex;align-items:center;justify-content:center;font-size:1.5rem;color:rgba(240,201,110,0.7);flex-shrink:0;overflow:hidden;}
.saint-banner .saint-icon img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.saint-banner .saint-text{flex:1;}
.saint-banner .saint-eyebrow{font-family:'Cinzel',serif;font-size:0.6rem;letter-spacing:0.2em;color:rgba(240,201,110,0.7);text-transform:uppercase;margin-bottom:0.15rem;}
.saint-banner .saint-name{font-family:'Cinzel Decorative',serif;font-size:1.05rem;color:var(--gold-light);}
.saint-banner .saint-feast{font-family:'Cinzel',serif;font-size:0.65rem;letter-spacing:0.1em;color:rgba(240,201,110,0.7);text-transform:uppercase;margin-top:0.2rem;}

/* LESSON BODY */
.lesson-body{font-size:1.02rem;line-height:1.75;color:rgba(244,232,193,0.92);margin-top:0.6rem;}
.lesson-body p{margin-bottom:1rem;}
.lesson-body p:last-child{margin-bottom:0;}

/* DISCUSSION QUESTIONS */
.discussion-questions{list-style:none;counter-reset:dq;margin-top:0.6rem;padding:0;}
.discussion-questions li{counter-increment:dq;padding:0.875rem 0 0.875rem 2.5rem;position:relative;font-size:1rem;line-height:1.65;color:rgba(244,232,193,0.85);border-bottom:1px solid rgba(201,146,42,0.1);}
.discussion-questions li:last-child{border-bottom:none;}
.discussion-questions li::before{content:counter(dq);position:absolute;left:0;top:0.7rem;width:1.6rem;height:1.6rem;background:rgba(107,26,26,0.45);border:1px solid rgba(201,146,42,0.4);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;font-size:0.75rem;color:var(--gold-light);}

/* READING / EXTERNAL LINKS */
.reading-link{display:inline-block;font-family:'Cinzel',serif;font-size:0.75rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--gold-light);text-decoration:none;padding:0.5rem 0.875rem;border:1px solid rgba(201,146,42,0.3);border-radius:8px;margin-top:0.4rem;transition:all 0.15s;}
.reading-link:hover{background:rgba(201,146,42,0.1);border-color:rgba(240,201,110,0.7);}

/* COMPLETE BUTTON ENABLED STATE */
.complete-btn[data-session-id]{opacity:1;cursor:pointer;box-shadow:0 4px 18px rgba(255,215,0,0.2);}
.complete-btn[data-complete="true"]{background:rgba(22,163,74,0.2);color:rgba(134,239,172,0.9);box-shadow:none;cursor:default;}
.complete-btn[data-action="t00-day1"]{opacity:1;cursor:pointer;box-shadow:0 4px 18px rgba(255,215,0,0.2);}
.complete-btn[data-action="t00-day1"]:disabled{cursor:default;}
.complete-btn[data-action="t00-day1"][data-complete="true"]{background:rgba(22,163,74,0.2);color:rgba(134,239,172,0.9);box-shadow:none;}

/* ── M/W/F DAY RAIL ─────────────────────────────────────────────────────── */
/* The day-tabs reused as a 3-dot progress rail. .done shows a check; .active is the live day. */
.day-rail .day-tab{position:relative;flex:1;max-width:160px;}
.day-rail .day-tab.done{background:rgba(22,163,74,0.14);border-color:rgba(134,239,172,0.62);color:rgba(134,239,172,0.85);}
.day-rail .day-tab.done .day-label{color:rgba(134,239,172,0.6);}
.day-rail .day-mark{position:absolute;top:0.3rem;right:0.55rem;width:1.1rem;height:1.1rem;border-radius:50%;background:rgba(134,239,172,0.85);color:#0e0800;font-size:0.7rem;line-height:1.1rem;text-align:center;font-weight:700;}

/* ── REWARD LINES ───────────────────────────────────────────────────────── */
.reward-hint{margin-top:0.7rem;font-family:'Cinzel',serif;font-size:0.7rem;letter-spacing:0.18em;text-transform:uppercase;color:rgba(240,201,110,0.7);text-align:center;}
.reward-line{margin-top:0.9rem;font-family:'Cinzel',serif;font-size:0.78rem;letter-spacing:0.18em;text-transform:uppercase;color:rgba(255,215,0,0.9);text-align:center;text-shadow:0 0 14px rgba(255,215,0,0.25);}
@keyframes rewardFlash{0%{transform:scale(0.96);opacity:0.4;}45%{transform:scale(1.04);opacity:1;text-shadow:0 0 32px rgba(255,215,0,0.8);}100%{transform:scale(1);opacity:1;text-shadow:0 0 14px rgba(255,215,0,0.25);}}
.reward-line-flash{animation:rewardFlash 0.9s ease-out;}

/* ── WEDNESDAY: PDF DOWNLOAD BUTTON ─────────────────────────────────────── */
.pdf-download-btn{display:flex;align-items:center;gap:1rem;width:100%;padding:1rem 1.1rem;background:linear-gradient(135deg,rgba(107,26,26,0.55),rgba(44,22,84,0.45));border:1.5px solid rgba(201,146,42,0.4);border-radius:12px;text-decoration:none;color:var(--parchment);transition:all 0.18s;min-height:64px;}
.pdf-download-btn:hover{border-color:rgba(255,215,0,0.65);transform:translateY(-1px);box-shadow:0 6px 20px rgba(0,0,0,0.4);}
.pdf-download-btn .pdf-icon{font-size:1.7rem;flex-shrink:0;color:var(--gold-light);}
.pdf-download-btn .pdf-text{flex:1;display:flex;flex-direction:column;gap:0.2rem;text-align:left;}
.pdf-download-btn .pdf-title{font-family:'Cinzel',serif;font-size:0.78rem;letter-spacing:0.14em;color:var(--gold-light);text-transform:uppercase;font-weight:600;}
.pdf-download-btn .pdf-subtitle{font-family:'Crimson Text',serif;font-size:0.88rem;color:rgba(244,232,193,0.7);font-style:italic;line-height:1.35;}
.pdf-download-btn .pdf-arrow{font-size:1.3rem;color:rgba(240,201,110,0.85);flex-shrink:0;transition:transform 0.18s;}
.pdf-download-btn:hover .pdf-arrow{transform:translateY(2px);color:var(--gold-bright);}

/* ── WEDNESDAY: VERIFICATION QUESTION ───────────────────────────────────── */
.verify-question{margin-top:0.4rem;}
.verify-question-text{font-family:'Crimson Text',serif;font-size:1.04rem;line-height:1.6;color:rgba(244,232,193,0.95);margin-bottom:0.95rem;}
.verify-options{display:flex;flex-direction:column;gap:0.55rem;margin-bottom:0.85rem;}
.verify-option{display:flex;align-items:flex-start;gap:0.7rem;padding:0.75rem 0.9rem;background:rgba(14,8,0,0.5);border:1px solid rgba(201,146,42,0.18);border-radius:10px;cursor:pointer;transition:all 0.15s;min-height:48px;}
.verify-option:hover{border-color:rgba(240,201,110,0.7);background:rgba(14,8,0,0.7);}
.verify-option input[type="radio"]{margin-top:0.18rem;flex-shrink:0;cursor:pointer;accent-color:var(--gold-bright);}
.verify-option input[type="radio"]:disabled{cursor:default;}
.verify-option-letter{font-family:'Cinzel',serif;font-size:0.78rem;letter-spacing:0.1em;color:var(--gold-light);font-weight:700;width:1.2rem;flex-shrink:0;}
.verify-option-text{flex:1;font-family:'Crimson Text',serif;font-size:0.98rem;line-height:1.45;color:rgba(244,232,193,0.85);}
.verify-option:has(input:checked){border-color:rgba(240,201,110,0.85);background:rgba(107,26,26,0.25);}
.verify-option.already-correct{border-color:rgba(134,239,172,0.62);background:rgba(22,163,74,0.12);}
.verify-submit-btn{display:block;width:100%;padding:0.75rem;background:linear-gradient(135deg,var(--gold),var(--gold-bright));border:none;border-radius:10px;font-family:'Cinzel',serif;font-size:0.78rem;letter-spacing:0.15em;color:var(--bg);font-weight:700;text-transform:uppercase;cursor:pointer;min-height:48px;}
.verify-submit-btn:hover{box-shadow:0 4px 16px rgba(255,215,0,0.25);}
.verify-submit-btn:disabled{opacity:0.6;cursor:default;box-shadow:none;}
.verify-feedback{margin-top:0.6rem;padding:0.7rem 0.85rem;border-radius:8px;font-family:'Crimson Text',serif;font-size:0.92rem;line-height:1.5;}
.verify-feedback:empty{display:none;padding:0;}
.verify-feedback-correct{background:rgba(22,163,74,0.14);border:1px solid rgba(134,239,172,0.35);color:rgba(220,250,220,0.95);}
.verify-feedback-wrong{background:rgba(107,26,26,0.22);border:1px solid rgba(244,180,180,0.3);color:rgba(255,215,200,0.95);font-style:italic;}
.verify-feedback-prompt{background:rgba(44,22,84,0.25);border:1px solid rgba(201,146,42,0.35);color:rgba(255,225,170,0.9);font-style:italic;}
.verify-feedback-locked{margin-top:0.55rem;}
.verify-confirmed{display:block;width:100%;padding:0.875rem;margin-top:0.4rem;background:rgba(22,163,74,0.18);border:1px solid rgba(134,239,172,0.35);border-radius:10px;text-align:center;font-family:'Cinzel',serif;font-size:0.78rem;letter-spacing:0.18em;color:rgba(134,239,172,0.95);text-transform:uppercase;font-weight:600;}

/* ── FRIDAY: QUIZ LAUNCHER ──────────────────────────────────────────────── */
.quiz-launcher-slot{background:rgba(14,8,0,0.5);border:1.5px solid rgba(201,146,42,0.25);}
.quiz-meta{display:grid;grid-template-columns:repeat(2,1fr);gap:0.55rem 0.9rem;margin:0.85rem 0 1rem;padding:0.85rem 1rem;background:rgba(44,22,84,0.18);border:1px solid rgba(201,146,42,0.15);border-radius:10px;}
.quiz-meta-item{display:flex;flex-direction:column;gap:0.15rem;}
.quiz-meta-label{font-family:'Cinzel',serif;font-size:0.6rem;letter-spacing:0.16em;text-transform:uppercase;color:rgba(240,201,110,0.7);}
.quiz-meta-value{font-family:'Cinzel Decorative',serif;font-size:0.95rem;color:var(--gold-light);}
.quiz-launcher-btn{display:block;width:100%;padding:1rem;background:linear-gradient(135deg,var(--burgundy),#8b2222);border:1.5px solid rgba(255,215,0,0.45);border-radius:12px;font-family:'Cinzel',serif;font-size:0.85rem;letter-spacing:0.18em;color:var(--gold-bright);text-decoration:none;text-align:center;text-transform:uppercase;font-weight:700;min-height:54px;display:flex;align-items:center;justify-content:center;transition:all 0.18s;box-shadow:0 4px 16px rgba(107,26,26,0.45);}
.quiz-launcher-btn:hover{transform:translateY(-1px);box-shadow:0 6px 22px rgba(255,215,0,0.25);border-color:rgba(255,215,0,0.7);}
.quiz-launcher-btn.done{background:rgba(22,163,74,0.18);border-color:rgba(134,239,172,0.62);color:rgba(134,239,172,0.95);box-shadow:none;}

/* ── WEEK COMPLETE BANNER (Friday after all 3 days done) ────────────────── */
.week-complete-banner{display:flex;align-items:center;gap:1.1rem;margin-top:1.3rem;padding:1.2rem 1.4rem;background:linear-gradient(135deg,rgba(255,215,0,0.1),rgba(107,26,26,0.18));border:1px solid rgba(255,215,0,0.3);border-radius:12px;}
.week-complete-icon{font-size:2rem;color:var(--gold-bright);text-shadow:0 0 24px rgba(255,215,0,0.5);flex-shrink:0;}
.week-complete-text{flex:1;}
.week-complete-title{font-family:'Cinzel Decorative',serif;font-size:1.15rem;color:var(--gold-light);margin-bottom:0.2rem;}
.week-complete-sub{font-family:'Crimson Text',serif;font-size:0.95rem;color:rgba(244,232,193,0.7);font-style:italic;}

/* ── ARTIFACT NOTE & MISC ───────────────────────────────────────────────── */
.artifact-note{margin-top:0.4rem;font-size:0.78rem;color:rgba(240,201,110,0.7);font-style:italic;}

/* ── REPAIR P — PREP MODE COUNTDOWN BANNER ─────────────────────────────── */
/* Shown only while today < spine.launch_date. Sits between the page header */
/* and the day's content. Disappears entirely on May 18 and after.          */
.prep-banner{
  margin:0 auto 1.6rem;
  padding:1.5rem 1.5rem 1.4rem;
  background:linear-gradient(160deg,rgba(244,232,193,0.10),rgba(244,232,193,0.04));
  border:1.5px solid rgba(201,146,42,0.38);
  border-radius:14px;
  text-align:center;
  position:relative;
  box-shadow:0 0 26px rgba(201,146,42,0.08) inset;
}
.prep-banner-eyebrow{
  font-family:'Cinzel',serif;
  font-size:0.7rem;
  letter-spacing:0.3em;
  color:rgba(240,201,110,0.85);
  text-transform:uppercase;
  margin-bottom:0.6rem;
}
.prep-banner-title{
  font-family:'Cinzel Decorative',serif;
  font-size:clamp(1.05rem,3.5vw,1.3rem);
  color:var(--gold-light);
  margin-bottom:0.65rem;
  text-shadow:0 0 18px rgba(201,146,42,0.25);
  line-height:1.35;
}
.prep-banner-title .ornament{
  color:rgba(240,201,110,0.85);
  margin:0 0.5rem;
  font-size:0.95em;
}
.prep-banner-countdown{
  font-family:'Cinzel',serif;
  font-size:0.95rem;
  letter-spacing:0.06em;
  color:var(--gold-bright);
  margin-bottom:0.55rem;
}
.prep-banner-note{
  font-family:'Crimson Text',serif;
  font-style:italic;
  font-size:0.95rem;
  color:rgba(244,232,193,0.65);
  line-height:1.5;
  max-width:34rem;
  margin:0 auto;
}

/* ── REPAIR P — LAUNCH CELEBRATION ─────────────────────────────────────── */
/* One-time overlay shown on May 18+ first-open (gated on localStorage).   */
/* Dignified, brief — fades in, single Begin tap, fades out and unmounts.  */
.launch-celebration{
  position:fixed;
  inset:0;
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:2rem 1.5rem;
  background:radial-gradient(ellipse at 50% 38%,rgba(107,26,26,0.92) 0%,rgba(14,8,0,0.97) 70%);
  -webkit-backdrop-filter:blur(8px);
  backdrop-filter:blur(8px);
  opacity:0;
  animation:lcFadeIn 1.4s ease-out forwards;
}
@keyframes lcFadeIn{to{opacity:1;}}
.launch-celebration.fading-out{animation:lcFadeOut 0.7s ease-in forwards;}
@keyframes lcFadeOut{to{opacity:0;visibility:hidden;}}
.launch-celebration-card{
  text-align:center;
  max-width:480px;
  animation:lcContent 1.6s ease-out 0.3s both;
}
@keyframes lcContent{
  from{opacity:0;transform:translateY(12px);}
  to{opacity:1;transform:translateY(0);}
}
.launch-celebration-logo{
  width:96px;height:96px;
  margin:0 auto 1.5rem;
  display:block;
  border-radius:50%;
  box-shadow:0 0 40px rgba(255,215,0,0.45),0 0 80px rgba(255,215,0,0.2);
  animation:lcGlow 3s ease-in-out infinite;
}
@keyframes lcGlow{
  0%,100%{box-shadow:0 0 40px rgba(255,215,0,0.45),0 0 80px rgba(255,215,0,0.2);}
  50%    {box-shadow:0 0 56px rgba(255,215,0,0.6), 0 0 110px rgba(255,215,0,0.3);}
}
.launch-celebration-title{
  font-family:'Cinzel Decorative',serif;
  font-size:clamp(1.4rem,5vw,1.85rem);
  color:var(--gold-light);
  margin-bottom:0.85rem;
  line-height:1.3;
}
.launch-celebration-title .ornament{
  color:rgba(240,201,110,0.85);
  margin:0 0.5rem;
}
.launch-celebration-welcome{
  font-family:'Crimson Text',serif;
  font-style:italic;
  font-size:1.1rem;
  color:rgba(244,232,193,0.82);
  margin-bottom:2rem;
  line-height:1.55;
}
.launch-celebration-btn{
  display:inline-block;
  min-width:180px;
  min-height:48px;
  padding:0.85rem 2.4rem;
  background:linear-gradient(135deg,var(--gold),var(--gold-bright));
  border:none;
  border-radius:12px;
  font-family:'Cinzel',serif;
  font-size:0.85rem;
  letter-spacing:0.22em;
  color:var(--bg);
  font-weight:700;
  text-transform:uppercase;
  cursor:pointer;
  box-shadow:0 4px 22px rgba(255,215,0,0.35);
  transition:transform 0.15s,box-shadow 0.15s;
}
.launch-celebration-btn:hover,
.launch-celebration-btn:focus{
  transform:translateY(-1px);
  box-shadow:0 6px 28px rgba(255,215,0,0.5);
  outline:none;
}
@media (prefers-reduced-motion: reduce){
  .launch-celebration,
  .launch-celebration-card,
  .launch-celebration-logo{animation:none;}
  .launch-celebration{opacity:1;}
}
</style>
</head>

<body>
<div class="container">
  <div id="page-root"></div>
</div>

<script src="js/day-state.js"></script>
<script src="js/pause-card.js"></script>
<script src="js/prayers.js"></script>
<script src="js/session-loader.js"></script>
<script src="js/calendar-loader.js"></script>
<script src="js/calendar-card.js"></script>
<script src="js/name-day-banner.js"></script>
<script src="js/topic-00-day.js"></script>
<script>
(async function main(){
  // ── LOAD THE PROGRAM SPINE ────────────────────────
  let spine;
  try {
    const res = await fetch('config/program-spine.json');
    spine = await res.json();
  } catch (e) {
    document.getElementById('page-root').innerHTML =
      '<div class="calm-frame"><div class="calm-title">Could not load the Expedition.</div>' +
      '<div class="calm-text">Please check your connection and try again.</div></div>';
    return;
  }

  // ── COMPUTE TODAY'S STATE ─────────────────────────
  let state = DayState.compute(new Date(), spine);

  // ── REPAIR P — SOFT-OPEN STATE SYNTHESIS (P.1) ─────
  // Pre-launch (today < spine.launch_date) we no longer hard-gate week.html
  // behind a countdown screen. Instead we synthesize a "Topic 00 Week 1"
  // shadow state so the existing render branches just work — Mon/Wed/Fri
  // surface the actual M/W/F content for session 00.1; Tue/Thu/Sat/Sun
  // surface their normal calm-frames. Completions write to the DB exactly
  // as they will post-launch (Option C — Honest Soft Start: whatever Nolan
  // completes pre-launch counts; the catechetical journey is a relationship,
  // not a software unlock).
  //
  // The May 18 spine date is preserved untouched. The launch-day celebration
  // moment (P.3 below) replaces the gate event with a one-time greeting.
  function softOpenLaunchDate(spineLaunchStr){
    const [y,m,d] = spineLaunchStr.split('-').map(Number);
    return new Date(y, m-1, d);
  }
  const __today = new Date(); __today.setHours(0,0,0,0);
  const __launch = softOpenLaunchDate(spine.launch_date);
  const isPreLaunch = __today < __launch;
  if (isPreLaunch && state.day_kind === 'pre_launch') {
    const dow = __today.getDay(); // 0=Sun..6=Sat
    let synthDayKind;
    if (dow === 0)      synthDayKind = 'sunday';
    else if (dow === 6) synthDayKind = 'saturday';
    else if (dow === 1) synthDayKind = 'day1';
    else if (dow === 3) synthDayKind = 'day2';
    else if (dow === 5) synthDayKind = 'day3';
    else                synthDayKind = 'between_sessions'; // Tue, Thu
    state = {
      ...state,
      day_kind: synthDayKind,
      phase: 'topic_00',
      program_week: 1,
      current_session_id: '00.1',
      session_week_number: 1,
      pause_reason: null,
      pause_resumes_on: null,
      is_study_day: ['day1','day2','day3'].includes(synthDayKind),
      is_topic_00: true,
      uses_three_day_model: true,
      next_session_starts_on: null,
    };
  }

  // ── SUPABASE + PROFILE (for prayers + future content) ──
  const SUPABASE_URL = 'https://ksfnsryfmkafwirzgjoe.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtzZm5zcnlmbWthZndpcnpnam9lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2ODM4MTcsImV4cCI6MjA5MTI1OTgxN30.mHQty44WBnjQY8BJ8KbPk_pp-yTcOaifGxCZPUO4xpY';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  let profileId = null;
  try {
    const timer = new Promise(r => setTimeout(() => r(null), 4000));
    const res = await Promise.race([sb.auth.getSession(), timer]);
    profileId = res?.data?.session?.user?.id || null;
  } catch (e) { /* not fatal */ }

  // ── INIT PRAYERS + FETCH STATUS ────────────────────
  await Prayers.init(sb, profileId);
  let prayerStatus = { morning: false, evening: false, streak: 0 };
  if (profileId) {
    try {
      const [todayStatus, streak] = await Promise.all([
        Prayers.getTodayStatus(),
        Prayers.getStreak(),
      ]);
      prayerStatus = { ...todayStatus, streak };
    } catch (e) {
      console.warn('Prayer status not available (Chat 2 migration may be pending).', e);
    }
  }

  // ── LOAD CURRENT SESSION CONTENT ───────────────────
  // Fetches session row + saint of the week + the explorer's progress.
  // Skipped during pre_launch (no current session) and pause states.
  let sessionData = { session: null, saint: null, progress: null, renderable: false };
  if (state.current_session_id) {
    try {
      sessionData = await SessionLoader.load(
        sb,
        profileId,
        state.current_session_id,
        state.session_week_number
      );
    } catch (e) {
      console.warn('Session load failed; rendering placeholders.', e);
    }
  }

  // ── LOAD TOPIC 00 M/W/F EXTRAS ─────────────────────
  // Topic 00 sessions need the handout row (PDF + verification questions +
  // reflection prompt) and the Friday quiz row (for the Day 3 launcher).
  // Other topics will follow this pattern in future lanes.
  let topic00Ctx = { handout: null, fridayQuiz: null };
  if (state.is_topic_00 && state.current_session_id && window.Topic00Day) {
    try {
      topic00Ctx = await Topic00Day.load(sb, state.current_session_id);
    } catch (e) {
      console.warn('Topic 00 extras load failed; will render with placeholders.', e);
    }
  }

  // ── LOAD PROFILE (for name-day banner) ─────────────
  // Reads name and patron_saint. patron_saint is a future schema
  // column — until Chat 2 adds it, the select degrades gracefully and
  // the name-day banner stays hidden.
  let profile = null;
  if (profileId) {
    try {
      const tryFull = await sb.from('profiles')
        .select('id, name, patron_saint')
        .eq('id', profileId)
        .maybeSingle();
      if (tryFull.error) {
        const fallback = await sb.from('profiles')
          .select('id, name')
          .eq('id', profileId)
          .maybeSingle();
        profile = fallback.data || null;
      } else {
        profile = tryFull.data || null;
      }
    } catch (e) {
      console.warn('Profile load failed; name-day banner will not render.', e);
    }
  }

  // ── LOAD TODAY'S LITURGICAL CALENDAR ROW ───────────
  // Single query, in-memory cache. Dashboard hides the calendar block
  // gracefully on out-of-range dates or query errors.
  let calendarRow = null;
  try {
    const { row } = await CalendarLoader.load(sb, CalendarLoader.todayKey());
    calendarRow = row;
  } catch (e) {
    console.warn('Calendar load failed; liturgical-context block will be empty.', e);
  }

  // ── COMPUTE NAME-DAY BANNER ────────────────────────
  // Returns empty string when not the explorer's patron's feast day.
  const nameDayBannerHtml = NameDayBanner.render(new Date(), profile);

  // ── COMPUTE CALENDAR CARD ──────────────────────────
  const calendarCardHtml = CalendarCard.render(calendarRow);

  // ── HELPERS ───────────────────────────────────────
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const todayLong = () => { const t = new Date(); return `${DAYS[t.getDay()]}, ${MONTHS[t.getMonth()]} ${t.getDate()}, ${t.getFullYear()}`; };
  const shortDay = () => DAYS[new Date().getDay()];
  function findSession(id){ if(!id) return null; for(const p of spine.phases){ const w = p.weeks.find(x=>x.session_id===id); if(w) return {phase:p,week:w}; } return null; }
  function formatLongDate(s){ if(!s) return ''; const [y,m,d] = s.split('-').map(Number); const x = new Date(y,m-1,d); return `${DAYS[x.getDay()]}, ${MONTHS[x.getMonth()]} ${x.getDate()}, ${x.getFullYear()}`; }
  function daysUntil(s){ if(!s) return 0; const [y,m,d] = s.split('-').map(Number); const t = new Date(y,m-1,d); const n = new Date(); n.setHours(0,0,0,0); return Math.max(0, Math.ceil((t-n)/86400000)); }
  function esc(s){ if(s==null)return''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
  function formatLessonText(text){ if(!text) return ''; const paragraphs = String(text).split(/\n\s*\n/); return paragraphs.map(p => `<p>${esc(p).replace(/\n/g,'<br>')}</p>`).join(''); }

  // ── REPAIR P — PREP BANNER + LAUNCH CELEBRATION (P.2 + P.3) ──────────
  // Page-load countdown: days/hours from now to the May 18 launch.
  function renderPrepBanner(){
    if (!isPreLaunch) return '';
    const now = new Date();
    const ms = __launch - now;
    if (ms <= 0) return '';
    const totalHours = Math.floor(ms / 3600000);
    const days = Math.floor(totalHours / 24);
    const hours = totalHours - (days * 24);
    let countdown;
    if (days > 0) {
      countdown = `${days} day${days === 1 ? '' : 's'}, ${hours} hour${hours === 1 ? '' : 's'}`;
    } else if (hours > 0) {
      countdown = `${hours} hour${hours === 1 ? '' : 's'}`;
    } else {
      const mins = Math.max(1, Math.floor(ms / 60000));
      countdown = `${mins} minute${mins === 1 ? '' : 's'}`;
    }
    return `
      <div class="prep-banner" role="status" aria-label="Preparation mode — expedition begins May 18">
        <div class="prep-banner-eyebrow">Preparation</div>
        <div class="prep-banner-title">
          <span class="ornament">✦</span>Your expedition begins Monday, May 18<span class="ornament">✦</span>
        </div>
        <div class="prep-banner-countdown">${countdown}</div>
        <div class="prep-banner-note">Explore freely. Your real journey starts then.</div>
      </div>
    `;
  }
  const prepBannerHtml = renderPrepBanner();

  // One-time launch celebration. Triggers when today >= launch AND the
  // localStorage flag has not yet been set on this device. Mounts after
  // the page renders so the underlying content is already painted —
  // tapping Begin fades the overlay out and reveals the normal week view.
  // localStorage is intentional: keeps the flag explorer-device-scoped
  // (Kevin's admin browser doesn't burn the celebration on Nolan's iPad)
  // and avoids a DB schema change.
  function maybeMountLaunchCelebration(){
    try {
      if (isPreLaunch) return;
      if (localStorage.getItem('seen_launch_celebration') === 'true') return;
    } catch (e) { /* localStorage unavailable — skip celebration silently */ return; }

    const overlay = document.createElement('div');
    overlay.className = 'launch-celebration';
    overlay.setAttribute('role', 'dialog');
    overlay.setAttribute('aria-modal', 'true');
    overlay.setAttribute('aria-label', 'The expedition has begun');
    overlay.innerHTML = `
      <div class="launch-celebration-card">
        <img class="launch-celebration-logo" src="icon-192.png" alt="" aria-hidden="true">
        <div class="launch-celebration-title">
          <span class="ornament">✦</span>The expedition has begun<span class="ornament">✦</span>
        </div>
        <div class="launch-celebration-welcome">Welcome, Nolan. Your journey starts here.</div>
        <button type="button" class="launch-celebration-btn" data-action="begin-expedition">Begin</button>
      </div>
    `;
    document.body.appendChild(overlay);

    const btn = overlay.querySelector('[data-action="begin-expedition"]');
    function dismiss(){
      try { localStorage.setItem('seen_launch_celebration', 'true'); } catch (e) {}
      overlay.classList.add('fading-out');
      setTimeout(() => { if (overlay.parentNode) overlay.parentNode.removeChild(overlay); }, 750);
    }
    btn.addEventListener('click', dismiss, { once: true });
    btn.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); dismiss(); }
    });
    // Focus the Begin button after the content fade-in finishes (matches the
    // 0.3s delay on the card animation + a small grace).
    setTimeout(() => { try { btn.focus(); } catch (e) {} }, 1200);
  }

  // ── ROUTING ───────────────────────────────────────
  const root = document.getElementById('page-root');
  const prayerPanel = Prayers.renderPanel(state, prayerStatus);

  // Name-day banner sits above everything for the explorer's patron
  // feast day. Hidden on pre_launch (Nolan isn't yet using the app
  // pre-May-18). Visible across all other states — even pause weeks,
  // because a name day is more important than any pause.
  const nameDayPrefix = (state.day_kind === 'pre_launch') ? '' : nameDayBannerHtml;

  if (state.day_kind === 'pre_launch') {
    // Safety fallback only — soft-open synthesis above means we never hit
    // this branch in normal flow. Kept as a defensive default so the page
    // never goes blank if state ever returns pre_launch unexpectedly.
    root.innerHTML = renderPreLaunch(state) + prayerPanel + renderBottomNav();
  } else if (state.day_kind === 'pause') {
    root.innerHTML = nameDayPrefix + PauseCard.render(state) + prayerPanel + renderBottomNav();
  } else if (state.day_kind === 'sunday') {
    root.innerHTML = nameDayPrefix + renderHeader(state) + prepBannerHtml + renderSunday() + prayerPanel + renderSaintBanner() + renderBottomNav();
  } else if (state.day_kind === 'saturday') {
    root.innerHTML = nameDayPrefix + renderHeader(state) + prepBannerHtml + renderSaturday() + prayerPanel + renderSaintBanner() + renderBottomNav();
  } else if (state.is_topic_00 && window.Topic00Day) {
    // Topic 00 — Monday/Wednesday/Friday cadence (Wave 2 Lane 2 build)
    // Mon/Wed/Fri render through Topic00Day. Tue/Thu render the rest-day
    // calm-frame WITH the M/W/F day rail above so Nolan keeps a sense of
    // where he is in the week.
    const renderState = SessionLoader.renderState(sessionData?.session);
    if (renderState === 'coming_soon') {
      const sess = sessionData.session;
      root.innerHTML = nameDayPrefix + renderHeader(state) + prepBannerHtml + `
        <div class="main-frame">
          <div class="day-heading">${esc(sess?.title || 'This Week')}</div>
          <div class="day-subheading">Coming soon</div>
          <div class="artifact-slot" style="text-align:center;padding:2rem 1.5rem;">
            <div class="artifact-icon">☩</div>
            <div class="artifact-title">This week's lesson is being prepared</div>
            <div class="artifact-blurb">${esc(sess?.scope_summary || 'Check back soon — this week\'s content will appear here when it\'s ready.')}</div>
          </div>
        </div>
      ` + prayerPanel + renderSaintBanner() + renderBottomNav();
    } else if (renderState === 'missing') {
      root.innerHTML = nameDayPrefix + renderHeader(state) + prepBannerHtml + `
        <div class="main-frame">
          <div class="day-heading">This Week's Lesson</div>
          <div class="day-subheading">Take it gently — read, reflect, write</div>
          <div class="artifact-slot placeholder">
            <div class="artifact-icon">📖</div>
            <div class="artifact-title">Awaiting this week's content</div>
            <div class="artifact-blurb">The lesson for this week will appear here when it is ready.</div>
          </div>
        </div>
      ` + prayerPanel + renderSaintBanner() + renderBottomNav();
    } else {
      // Renderable — branch on day_kind for M/W/F treatment
      const dayRail = Topic00Day.renderDayRail(state, sessionData?.progress);
      const main = Topic00Day.render(state, sessionData, topic00Ctx);
      root.innerHTML = nameDayPrefix + renderHeader(state) + prepBannerHtml + dayRail + main + prayerPanel + renderSaintBanner() + renderBottomNav();
      Topic00Day.attachHandlers(sb, profileId, sessionData, topic00Ctx);
    }
  } else if (state.day_kind === 'between_sessions') {
    root.innerHTML = nameDayPrefix + renderHeader(state) + prepBannerHtml + renderBetweenSessions() + prayerPanel + renderSaintBanner() + renderBottomNav();
  } else if (['day1','day2','day3'].includes(state.day_kind)) {
    root.innerHTML = nameDayPrefix + renderHeader(state) + prepBannerHtml + renderDayTabs(state) + renderThreeDayView(state) + prayerPanel + renderSidebar() + renderSaintBanner() + renderBottomNav();
  } else {
    root.innerHTML = nameDayPrefix + renderHeader(state) + prepBannerHtml + renderUnknown() + prayerPanel + renderBottomNav();
  }

  // ── REPAIR P — LAUNCH CELEBRATION MOUNT (P.3) ──────
  // Runs after the page is rendered so the underlying content is already
  // painted under the overlay. No-ops pre-launch and after the flag is set.
  maybeMountLaunchCelebration();

  // ── RENDER FUNCTIONS ──────────────────────────────
  function renderPreLaunch(s){
    const launchDate = formatLongDate(s.next_session_starts_on);
    const days = daysUntil(s.next_session_starts_on);
    return `<div class="pre-launch"><div class="icon">☩</div><h2>The Expedition Begins</h2><p>Welcome, Nolan. The Orthodox Expedition has not yet begun. Soon you will walk through the open door of the Church and begin to learn what is happening inside.</p><div class="when">${launchDate}</div><p style="font-family:'Caveat',cursive;font-size:1.2rem;color:rgba(240,201,110,0.85);">${days > 0 ? `${days} day${days === 1 ? '' : 's'} until we begin` : 'We begin today.'}</p></div>`;
  }
  function renderHeader(s){
    const session = findSession(s.current_session_id);
    return `<div class="header"><div class="greeting">Today</div><div class="day-name">${shortDay()}</div><div class="full-date">${todayLong()}</div><div class="liturgical-context">${calendarCardHtml}</div>${session ? `<div class="session-title">${session.week.title || 'Awaiting Session Title'}</div><div class="session-week">Week ${s.session_week_number} of ${session.phase.weeks.length} · ${session.phase.name.replace(/^[^—]+—\s*/, '')}</div>` : ''}</div>`;
  }
  function renderDayTabs(s){
    const d = s.day_kind;
    return `<div class="day-tabs" role="tablist" aria-label="Days of this week's session"><div class="day-tab ${d==='day1'?'active':''}"><span class="day-label">Monday</span>Day 1 · Teach</div><div class="day-tab ${d==='day2'?'active':''}"><span class="day-label">Wednesday</span>Day 2 · Work</div><div class="day-tab ${d==='day3'?'active':''}"><span class="day-label">Friday</span>Day 3 · Reflect</div></div>`;
  }
  function renderThreeDayView(s){
    if(s.day_kind === 'day1') return `<div class="main-frame"><div class="day-heading">Day 1 — The Teaching Day</div><div class="day-subheading">Today with your father</div><div class="artifact-slot placeholder" data-slot="lesson"><div class="artifact-icon">📖</div><div class="artifact-title">The Lesson</div><div class="artifact-blurb">Your father will teach this lesson to you. Read along and join in the discussion as he goes.</div></div><div class="artifact-slot placeholder" data-slot="parent_companion_link"><div class="artifact-icon">✦</div><div class="artifact-title">For Your Father</div><div class="artifact-blurb">A companion guide is ready for him with the discussion questions and teaching notes.</div></div><div class="artifact-slot placeholder" data-slot="opening_journal"><div class="artifact-icon">✎</div><div class="artifact-title">Your Opening Reflection</div><div class="artifact-blurb">After the teaching, write a short entry in your Field Manual about what struck you.</div></div><button class="complete-btn" data-action="complete-day-1">Mark Day 1 Complete</button></div>`;
    if(s.day_kind === 'day2') return `<div class="main-frame"><div class="day-heading">Day 2 — The Independent Day</div><div class="day-subheading">Today on your own</div><div class="artifact-slot placeholder" data-slot="personal_reading"><div class="artifact-icon">☩</div><div class="artifact-title">The Personal Reading</div><div class="artifact-blurb">Read this week's Scripture passage in your Holy Scriptures reader.</div></div><div class="artifact-slot placeholder" data-slot="workbook"><div class="artifact-icon">✎</div><div class="artifact-title">The Workbook</div><div class="artifact-blurb">Work through this week's exercises. You can do them on the tablet or print them.</div></div><div class="artifact-slot placeholder" data-slot="quiz1"><div class="artifact-icon">◈</div><div class="artifact-title">Quick Check</div><div class="artifact-blurb">A short check for understanding — five questions or so.</div></div><div class="artifact-slot placeholder" data-slot="session_game"><div class="artifact-icon">⚔</div><div class="artifact-title">The Session Game</div><div class="artifact-blurb">If a game is ready for this lesson, you'll find it here.</div></div><button class="complete-btn" data-action="complete-day-2">Mark Day 2 Complete</button></div>`;
    if(s.day_kind === 'day3') return `<div class="main-frame"><div class="day-heading">Day 3 — The Reflection Day</div><div class="day-subheading">What did this week mean?</div><div class="artifact-slot placeholder" data-slot="field_manual_entry"><div class="artifact-icon">📓</div><div class="artifact-title">Field Manual Entry</div><div class="artifact-blurb">Write your full reflection on this week's lesson in your Field Manual.</div></div><div class="artifact-slot placeholder" data-slot="session_test"><div class="artifact-icon">◈</div><div class="artifact-title">The Session Test</div><div class="artifact-blurb">A longer set of questions covering the whole week. Some will be marked for your father to read.</div></div><div class="artifact-slot placeholder" data-slot="memorization"><div class="artifact-icon">✦</div><div class="artifact-title">Memorization Practice</div><div class="artifact-blurb">Practice what you are learning by heart. When you're ready, ask your father to listen.</div></div><button class="complete-btn" data-action="complete-day-3">Complete the Week</button></div>`;
    return '';
  }
  // ── renderTopic00View REMOVED (Wave 2 Lane 2) ─────────────────────────
  // Topic 00 now uses the M/W/F cadence rendered by js/topic-00-day.js
  // (window.Topic00Day). The previous "light-model" single-button writer
  // wrote to session_progress with the wrong column name (profile_id, when
  // the schema uses explorer_id) and only stamped day_3_completed_at; both
  // problems are fixed in the new module.

  function renderSunday(){
    return `<div class="calm-frame"><div class="calm-icon">☩</div><div class="calm-title">This Sunday at Liturgy</div><div class="calm-text">Today is Sunday — the lived heart of the week. Go to Liturgy with your family.</div><div class="artifact-slot placeholder" data-slot="sunday_watch_for" style="margin-top:1.5rem;text-align:left;"><div class="artifact-icon">✦</div><div class="artifact-title">What to Watch For</div><div class="artifact-blurb">When this week's session is loaded, the one thing to listen for at Liturgy will be here.</div></div><div class="calm-quote">"Behold, I make all things new."</div></div>`;
  }
  function renderSaturday(){
    return `<div class="calm-frame"><div class="calm-icon">◈</div><div class="calm-title">Today is Saturday</div><div class="calm-text">Saturday is for rest. The Expedition does not ask anything of you today. Pray your morning and evening prayers, and prepare your heart for Liturgy tomorrow.</div><div class="calm-quote">"There remains a Sabbath rest for the people of God."</div></div>`;
  }
  function renderBetweenSessions(){
    return `<div class="calm-frame"><div class="calm-icon">✦</div><div class="calm-title">A Quiet Day</div><div class="calm-text">No new work today. The next teaching day is coming. You can revisit your Field Manual, practice your memorization, or read a saint's life.</div></div>`;
  }
  function renderUnknown(){
    return `<div class="calm-frame"><div class="calm-icon">☩</div><div class="calm-title">The Expedition is Complete</div><div class="calm-text">Three years have passed. You have walked the path. Glory to God.</div></div>`;
  }
  function renderSidebar(){
    return `<div class="sidebar"><div class="side-card"><div class="side-eyebrow">Earlier This Week</div><div class="side-content" data-slot="pending_work"><em>(Once you start completing days, anything not yet finished will appear here.)</em></div></div><div class="side-card"><div class="side-eyebrow">Coming Up</div><div class="side-content" data-slot="coming_up"><em>This Sunday's Liturgy.</em></div></div></div>`;
  }
  function renderSaintBanner(){
    const saint = sessionData.saint;
    if (!saint) {
      // No saint row yet — render placeholder
      return `<div class="saint-banner" data-slot="saint_of_week"><div class="saint-icon">☩</div><div class="saint-text"><div class="saint-eyebrow">This Week's Saint</div><div class="saint-name">— Awaiting Saint of the Week —</div></div></div>`;
    }
    const feastLine = saint.feast_day
      ? `<div class="saint-feast">Feast: ${esc(saint.feast_day)}</div>`
      : '';
    const iconImg = saint.icon_url
      ? `<img src="${esc(saint.icon_url)}" alt="${esc(saint.saint_name || '')}" />`
      : '☩';
    return `
      <div class="saint-banner" data-slot="saint_of_week">
        <div class="saint-icon">${iconImg}</div>
        <div class="saint-text">
          <div class="saint-eyebrow">This Week's Saint</div>
          <div class="saint-name">${esc(saint.saint_name || '— Saint not yet named —')}</div>
          ${feastLine}
        </div>
      </div>`;
  }
  function renderBottomNav(){
    return `<div class="bottom-nav"><a href="journal.html">Field Manual</a><a href="bible-reader.html">Holy Scriptures</a><a href="games.html">Training Grounds</a><a href="index.html?signout=1">Sign Out</a></div>`;
  }

  // ── DAY-COMPLETION HANDLERS (Wave 2 Lane 2) ────────────────────────────
  // M/W/F handlers are wired up by Topic00Day.attachHandlers() above when
  // Topic 00 routing fires. The previous "light-model" single-button writer
  // was removed (it used the wrong column name profile_id, when the actual
  // schema column is explorer_id, and only stamped day_3 — both fixed in
  // the new module).
})();
</script>

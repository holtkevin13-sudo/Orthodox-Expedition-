<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>This Week — The Orthodox Expedition</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Caveat:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --gold:#c9922a;
  --gold-light:#f0c96e;
  --gold-bright:#ffd700;
  --parchment:#f4e8c1;
  --ink:#1a0f00;
  --burgundy:#6b1a1a;
  --byzantine:#2c1654;
  --bg:#0e0800;
  --green:#16a34a;
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{min-height:100%;overflow-x:hidden;}
body{
  font-family:'Crimson Text',serif;
  background:var(--bg);
  background-image:
    radial-gradient(ellipse at 50% 0%,rgba(107,26,26,0.5) 0%,transparent 55%),
    radial-gradient(ellipse at 100% 100%,rgba(44,22,84,0.35) 0%,transparent 50%);
  min-height:100vh;
  color:var(--parchment);
  padding:1rem 1rem 4rem;
}
body::before{
  content:'';
  position:fixed;
  inset:0;
  background-image:
    linear-gradient(rgba(201,146,42,0.02) 1px,transparent 1px),
    linear-gradient(90deg,rgba(201,146,42,0.02) 1px,transparent 1px);
  background-size:44px 44px;
  pointer-events:none;
  z-index:0;
}

.container{
  max-width:680px;
  margin:0 auto;
  position:relative;
  z-index:1;
}

/* HEADER */
.header{text-align:center;padding:1.5rem 0 1rem;border-bottom:1px solid rgba(201,146,42,0.15);margin-bottom:2rem;}
.greeting{font-family:'Cinzel',serif;font-size:0.7rem;letter-spacing:0.25em;color:rgba(201,146,42,0.5);text-transform:uppercase;margin-bottom:0.4rem;}
.day-name{font-family:'Cinzel Decorative',serif;font-size:clamp(1.4rem,5vw,1.9rem);color:var(--gold-light);text-shadow:0 0 18px rgba(201,146,42,0.35);margin-bottom:0.15rem;}
.full-date{font-family:'Crimson Text',serif;font-style:italic;font-size:0.95rem;color:rgba(244,232,193,0.55);margin-bottom:0.75rem;}
.liturgical-context{margin-top:0.5rem;margin-bottom:0;text-align:left;}
.liturgical-context:empty{display:none;}
.session-title{font-family:'Cinzel Decorative',serif;font-size:clamp(1rem,3.5vw,1.25rem);color:var(--parchment);margin-bottom:0.25rem;padding:0 1rem;}
.session-week{font-family:'Cinzel',serif;font-size:0.65rem;letter-spacing:0.2em;color:rgba(201,146,42,0.4);text-transform:uppercase;}

/* DAY TABS */
.day-tabs{display:flex;justify-content:center;gap:0.4rem;margin-bottom:2rem;flex-wrap:wrap;}
.day-tab{padding:0.5rem 1rem;min-width:110px;min-height:48px;background:rgba(44,22,84,0.18);border:1px solid rgba(201,146,42,0.18);border-radius:10px;font-family:'Cinzel',serif;font-size:0.7rem;letter-spacing:0.1em;color:rgba(201,146,42,0.5);text-transform:uppercase;cursor:default;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.3;}
.day-tab .day-label{font-size:0.62rem;color:rgba(201,146,42,0.35);}
.day-tab.active{background:rgba(107,26,26,0.35);border-color:rgba(255,215,0,0.4);color:var(--gold-bright);box-shadow:0 0 16px rgba(255,215,0,0.15);}
.day-tab.active .day-label{color:rgba(255,215,0,0.6);}

/* MAIN FRAME */
.main-frame{background:linear-gradient(160deg,rgba(244,232,193,0.04),rgba(244,232,193,0.01));border:1.5px solid rgba(201,146,42,0.18);border-radius:16px;padding:2rem 1.5rem;margin-bottom:1.5rem;}
.day-heading{font-family:'Cinzel Decorative',serif;font-size:1.3rem;color:var(--gold-light);margin-bottom:0.25rem;text-align:center;}
.day-subheading{font-family:'Cinzel',serif;font-size:0.65rem;letter-spacing:0.2em;color:rgba(201,146,42,0.5);text-transform:uppercase;margin-bottom:1.5rem;text-align:center;}

/* ARTIFACT SLOTS */
.artifact-slot{margin-bottom:1.25rem;padding:1.25rem;background:rgba(14,8,0,0.4);border:1px solid rgba(201,146,42,0.12);border-radius:10px;position:relative;}
.artifact-slot.placeholder::before{content:'AWAITING CONTENT';position:absolute;top:0.5rem;right:0.75rem;font-family:'Cinzel',serif;font-size:0.55rem;letter-spacing:0.2em;color:rgba(201,146,42,0.25);}
.artifact-icon{font-size:1.5rem;color:var(--gold);margin-bottom:0.4rem;}
.artifact-title{font-family:'Cinzel Decorative',serif;font-size:1.05rem;color:var(--gold-light);margin-bottom:0.25rem;}
.artifact-blurb{font-size:0.88rem;color:rgba(244,232,193,0.55);line-height:1.5;font-style:italic;}

/* COMPLETE BUTTON */
.complete-btn{display:block;width:100%;padding:0.875rem;margin-top:1rem;background:linear-gradient(135deg,var(--gold),var(--gold-bright));border:none;border-radius:12px;font-family:'Cinzel',serif;font-size:0.8rem;letter-spacing:0.15em;color:var(--bg);font-weight:700;cursor:pointer;text-transform:uppercase;min-height:52px;opacity:0.4;cursor:not-allowed;}
.complete-btn[data-ready="true"]{opacity:1;cursor:pointer;box-shadow:0 4px 18px rgba(255,215,0,0.2);}

/* SIDEBAR */
.sidebar{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:2rem;}
@media(max-width:520px){.sidebar{grid-template-columns:1fr;}}
.side-card{padding:1.25rem;background:rgba(44,22,84,0.12);border:1px solid rgba(201,146,42,0.12);border-radius:12px;}
.side-eyebrow{font-family:'Cinzel',serif;font-size:0.6rem;letter-spacing:0.2em;color:rgba(201,146,42,0.5);text-transform:uppercase;margin-bottom:0.5rem;}
.side-content{font-size:0.9rem;color:rgba(244,232,193,0.65);line-height:1.5;}
.side-content em{color:rgba(201,146,42,0.6);font-style:italic;}

/* PRAYER PANEL */
.prayer-panel{margin-bottom:1.5rem;padding:1.25rem 1.5rem;background:rgba(44,22,84,0.18);border:1px solid rgba(201,146,42,0.18);border-radius:12px;}
.prayer-panel-eyebrow{font-family:'Cinzel',serif;font-size:0.7rem;letter-spacing:0.2em;color:rgba(201,146,42,0.55);text-transform:uppercase;margin-bottom:0.875rem;text-align:center;}
.prayer-panel-row{display:flex;gap:0.875rem;flex-wrap:wrap;}
.prayer-link{display:flex;align-items:center;gap:0.6rem;flex:1;min-width:200px;padding:0.875rem 1rem;background:rgba(14,8,0,0.4);border:1px solid rgba(201,146,42,0.18);border-radius:10px;text-decoration:none;font-family:'Cinzel',serif;font-size:0.78rem;letter-spacing:0.05em;color:rgba(244,232,193,0.7);min-height:48px;transition:all 0.15s;}
.prayer-link:hover{border-color:rgba(201,146,42,0.4);color:var(--gold-light);}
.prayer-link.done{background:rgba(22,163,74,0.1);border-color:rgba(22,163,74,0.3);color:rgba(134,239,172,0.85);}
.prayer-link .prayer-mark{font-size:1.3rem;color:rgba(201,146,42,0.6);}
.prayer-link.done .prayer-mark{color:rgba(134,239,172,0.9);}
.prayer-panel-streak{margin-top:0.875rem;padding-top:0.875rem;border-top:1px solid rgba(201,146,42,0.12);font-family:'Caveat',cursive;font-size:1.05rem;color:rgba(201,146,42,0.7);text-align:center;}

/* BOTTOM NAV */
.bottom-nav{display:flex;justify-content:center;gap:1rem;padding-top:1.5rem;border-top:1px solid rgba(201,146,42,0.15);flex-wrap:wrap;}
.bottom-nav a{font-family:'Cinzel',serif;font-size:0.7rem;letter-spacing:0.15em;color:rgba(201,146,42,0.55);text-decoration:none;text-transform:uppercase;padding:0.5rem 0.875rem;min-height:40px;display:inline-flex;align-items:center;border:1px solid rgba(201,146,42,0.15);border-radius:8px;}
.bottom-nav a:hover{color:var(--gold-light);border-color:rgba(201,146,42,0.35);}

/* PRE-LAUNCH */
.pre-launch{text-align:center;padding:3rem 1.5rem;max-width:480px;margin:2rem auto;}
.pre-launch .icon{font-size:3rem;color:var(--gold);text-shadow:0 0 20px rgba(255,215,0,0.4);margin-bottom:1rem;}
.pre-launch h2{font-family:'Cinzel Decorative',serif;font-size:1.7rem;color:var(--gold-light);margin-bottom:0.5rem;}
.pre-launch .when{font-family:'Cinzel',serif;font-size:0.95rem;color:var(--gold-bright);letter-spacing:0.1em;margin:1rem 0;}
.pre-launch p{color:rgba(244,232,193,0.65);line-height:1.6;font-style:italic;margin-bottom:1rem;}

/* CALM FRAMES (Sun/Sat/between) */
.calm-frame{text-align:center;padding:2.5rem 1.5rem;background:linear-gradient(160deg,rgba(244,232,193,0.04),rgba(244,232,193,0.01));border:1.5px solid rgba(201,146,42,0.15);border-radius:16px;margin-bottom:1.5rem;}
.calm-icon{font-size:2.5rem;color:var(--gold);margin-bottom:0.75rem;text-shadow:0 0 20px rgba(201,146,42,0.3);}
.calm-title{font-family:'Cinzel Decorative',serif;font-size:1.4rem;color:var(--gold-light);margin-bottom:0.5rem;}
.calm-text{font-size:1rem;color:rgba(244,232,193,0.7);line-height:1.6;max-width:420px;margin:0 auto;}
.calm-quote{font-family:'Caveat',cursive;font-size:1.15rem;color:rgba(201,146,42,0.7);margin-top:1.25rem;font-style:italic;}

/* SAINT BANNER */
.saint-banner{display:flex;align-items:center;gap:1rem;padding:1rem 1.25rem;background:rgba(107,26,26,0.18);border:1px solid rgba(201,146,42,0.2);border-radius:12px;margin-bottom:1.5rem;}
.saint-banner .saint-icon{width:54px;height:54px;border-radius:50%;background:rgba(44,22,84,0.5);border:2px solid rgba(201,146,42,0.3);display:flex;align-items:center;justify-content:center;font-size:1.5rem;color:rgba(201,146,42,0.5);flex-shrink:0;overflow:hidden;}
.saint-banner .saint-icon img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.saint-banner .saint-text{flex:1;}
.saint-banner .saint-eyebrow{font-family:'Cinzel',serif;font-size:0.6rem;letter-spacing:0.2em;color:rgba(201,146,42,0.5);text-transform:uppercase;margin-bottom:0.15rem;}
.saint-banner .saint-name{font-family:'Cinzel Decorative',serif;font-size:1.05rem;color:var(--gold-light);}
.saint-banner .saint-feast{font-family:'Cinzel',serif;font-size:0.65rem;letter-spacing:0.1em;color:rgba(201,146,42,0.5);text-transform:uppercase;margin-top:0.2rem;}

/* LESSON BODY */
.lesson-body{font-size:1.02rem;line-height:1.75;color:rgba(244,232,193,0.92);margin-top:0.6rem;}
.lesson-body p{margin-bottom:1rem;}
.lesson-body p:last-child{margin-bottom:0;}

/* DISCUSSION QUESTIONS */
.discussion-questions{list-style:none;counter-reset:dq;margin-top:0.6rem;padding:0;}
.discussion-questions li{counter-increment:dq;padding:0.875rem 0 0.875rem 2.5rem;position:relative;font-size:1rem;line-height:1.65;color:rgba(244,232,193,0.85);border-bottom:1px solid rgba(201,146,42,0.1);}
.discussion-questions li:last-child{border-bottom:none;}
.discussion-questions li::before{content:counter(dq);position:absolute;left:0;top:0.7rem;width:1.6rem;height:1.6rem;background:rgba(107,26,26,0.45);border:1px solid rgba(201,146,42,0.4);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;font-size:0.75rem;color:var(--gold-light);}

/* READING / EXTERNAL LINKS */
.reading-link{display:inline-block;font-family:'Cinzel',serif;font-size:0.75rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--gold-light);text-decoration:none;padding:0.5rem 0.875rem;border:1px solid rgba(201,146,42,0.3);border-radius:8px;margin-top:0.4rem;transition:all 0.15s;}
.reading-link:hover{background:rgba(201,146,42,0.1);border-color:rgba(201,146,42,0.5);}

/* COMPLETE BUTTON ENABLED STATE */
.complete-btn[data-session-id]{opacity:1;cursor:pointer;box-shadow:0 4px 18px rgba(255,215,0,0.2);}
.complete-btn[data-complete="true"]{background:rgba(22,163,74,0.2);color:rgba(134,239,172,0.9);box-shadow:none;cursor:default;}
</style>
</head>

<body>
<div class="container">
  <div id="page-root"></div>
</div>

<script src="js/day-state.js"></script>
<script src="js/pause-card.js"></script>
<script src="js/prayers.js"></script>
<script src="js/session-loader.js"></script>
<script src="js/calendar-loader.js"></script>
<script src="js/calendar-card.js"></script>
<script src="js/name-day-banner.js"></script>
<script>
(async function main(){
  // ── LOAD THE PROGRAM SPINE ────────────────────────
  let spine;
  try {
    const res = await fetch('config/program-spine.json');
    spine = await res.json();
  } catch (e) {
    document.getElementById('page-root').innerHTML =
      '<div class="calm-frame"><div class="calm-title">Could not load the Expedition.</div>' +
      '<div class="calm-text">Please check your connection and try again.</div></div>';
    return;
  }

  // ── COMPUTE TODAY'S STATE ─────────────────────────
  const state = DayState.compute(new Date(), spine);

  // ── SUPABASE + PROFILE (for prayers + future content) ──
  const SUPABASE_URL = 'https://ksfnsryfmkafwirzgjoe.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtzZm5zcnlmbWthZndpcnpnam9lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2ODM4MTcsImV4cCI6MjA5MTI1OTgxN30.mHQty44WBnjQY8BJ8KbPk_pp-yTcOaifGxCZPUO4xpY';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  let profileId = null;
  try {
    const timer = new Promise(r => setTimeout(() => r(null), 4000));
    const res = await Promise.race([sb.auth.getSession(), timer]);
    profileId = res?.data?.session?.user?.id || null;
  } catch (e) { /* not fatal */ }

  // ── INIT PRAYERS + FETCH STATUS ────────────────────
  await Prayers.init(sb, profileId);
  let prayerStatus = { morning: false, evening: false, streak: 0 };
  if (profileId) {
    try {
      const [todayStatus, streak] = await Promise.all([
        Prayers.getTodayStatus(),
        Prayers.getStreak(),
      ]);
      prayerStatus = { ...todayStatus, streak };
    } catch (e) {
      console.warn('Prayer status not available (Chat 2 migration may be pending).', e);
    }
  }

  // ── LOAD CURRENT SESSION CONTENT ───────────────────
  // Fetches session row + saint of the week + the explorer's progress.
  // Skipped during pre_launch (no current session) and pause states.
  let sessionData = { session: null, saint: null, progress: null, renderable: false };
  if (state.current_session_id) {
    try {
      sessionData = await SessionLoader.load(
        sb,
        profileId,
        state.current_session_id,
        state.session_week_number
      );
    } catch (e) {
      console.warn('Session load failed; rendering placeholders.', e);
    }
  }

  // ── LOAD PROFILE (for name-day banner) ─────────────
  // Reads full_name and patron_saint. patron_saint is a future schema
  // column — until Chat 2 adds it, the select degrades gracefully and
  // the name-day banner stays hidden.
  let profile = null;
  if (profileId) {
    try {
      const tryFull = await sb.from('profiles')
        .select('id, full_name, patron_saint')
        .eq('id', profileId)
        .maybeSingle();
      if (tryFull.error) {
        const fallback = await sb.from('profiles')
          .select('id, full_name')
          .eq('id', profileId)
          .maybeSingle();
        profile = fallback.data || null;
      } else {
        profile = tryFull.data || null;
      }
    } catch (e) {
      console.warn('Profile load failed; name-day banner will not render.', e);
    }
  }

  // ── LOAD TODAY'S LITURGICAL CALENDAR ROW ───────────
  // Single query, in-memory cache. Dashboard hides the calendar block
  // gracefully on out-of-range dates or query errors.
  let calendarRow = null;
  try {
    const { row } = await CalendarLoader.load(sb, CalendarLoader.todayKey());
    calendarRow = row;
  } catch (e) {
    console.warn('Calendar load failed; liturgical-context block will be empty.', e);
  }

  // ── COMPUTE NAME-DAY BANNER ────────────────────────
  // Returns empty string when not the explorer's patron's feast day.
  const nameDayBannerHtml = NameDayBanner.render(new Date(), profile);

  // ── COMPUTE CALENDAR CARD ──────────────────────────
  const calendarCardHtml = CalendarCard.render(calendarRow);

  // ── HELPERS ───────────────────────────────────────
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const todayLong = () => { const t = new Date(); return `${DAYS[t.getDay()]}, ${MONTHS[t.getMonth()]} ${t.getDate()}, ${t.getFullYear()}`; };
  const shortDay = () => DAYS[new Date().getDay()];
  function findSession(id){ if(!id) return null; for(const p of spine.phases){ const w = p.weeks.find(x=>x.session_id===id); if(w) return {phase:p,week:w}; } return null; }
  function formatLongDate(s){ if(!s) return ''; const [y,m,d] = s.split('-').map(Number); const x = new Date(y,m-1,d); return `${DAYS[x.getDay()]}, ${MONTHS[x.getMonth()]} ${x.getDate()}, ${x.getFullYear()}`; }
  function daysUntil(s){ if(!s) return 0; const [y,m,d] = s.split('-').map(Number); const t = new Date(y,m-1,d); const n = new Date(); n.setHours(0,0,0,0); return Math.max(0, Math.ceil((t-n)/86400000)); }
  function esc(s){ if(s==null)return''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
  function formatLessonText(text){ if(!text) return ''; const paragraphs = String(text).split(/\n\s*\n/); return paragraphs.map(p => `<p>${esc(p).replace(/\n/g,'<br>')}</p>`).join(''); }

  // ── ROUTING ───────────────────────────────────────
  const root = document.getElementById('page-root');
  const prayerPanel = Prayers.renderPanel(state, prayerStatus);

  // Name-day banner sits above everything for the explorer's patron
  // feast day. Hidden on pre_launch (Nolan isn't yet using the app
  // pre-May-18). Visible across all other states — even pause weeks,
  // because a name day is more important than any pause.
  const nameDayPrefix = (state.day_kind === 'pre_launch') ? '' : nameDayBannerHtml;

  if (state.day_kind === 'pre_launch') {
    root.innerHTML = renderPreLaunch(state) + prayerPanel + renderBottomNav();
  } else if (state.day_kind === 'pause') {
    root.innerHTML = nameDayPrefix + PauseCard.render(state) + prayerPanel + renderBottomNav();
  } else if (state.day_kind === 'sunday') {
    root.innerHTML = nameDayPrefix + renderHeader(state) + renderSunday() + prayerPanel + renderSaintBanner() + renderBottomNav();
  } else if (state.day_kind === 'saturday') {
    root.innerHTML = nameDayPrefix + renderHeader(state) + renderSaturday() + prayerPanel + renderSaintBanner() + renderBottomNav();
  } else if (state.day_kind === 'between_sessions') {
    root.innerHTML = nameDayPrefix + renderHeader(state) + renderBetweenSessions() + prayerPanel + renderSaintBanner() + renderBottomNav();
  } else if (state.is_topic_00) {
    root.innerHTML = nameDayPrefix + renderHeader(state) + renderTopic00View() + prayerPanel + renderSaintBanner() + renderBottomNav();
  } else if (['day1','day2','day3'].includes(state.day_kind)) {
    root.innerHTML = nameDayPrefix + renderHeader(state) + renderDayTabs(state) + renderThreeDayView(state) + prayerPanel + renderSidebar() + renderSaintBanner() + renderBottomNav();
  } else {
    root.innerHTML = nameDayPrefix + renderHeader(state) + renderUnknown() + prayerPanel + renderBottomNav();
  }

  // ── RENDER FUNCTIONS ──────────────────────────────
  function renderPreLaunch(s){
    const launchDate = formatLongDate(s.next_session_starts_on);
    const days = daysUntil(s.next_session_starts_on);
    return `<div class="pre-launch"><div class="icon">☩</div><h2>The Expedition Begins</h2><p>Welcome, Nolan. The Orthodox Expedition has not yet begun. Soon you will walk through the open door of the Church and begin to learn what is happening inside.</p><div class="when">${launchDate}</div><p style="font-family:'Caveat',cursive;font-size:1.2rem;color:rgba(201,146,42,0.7);">${days > 0 ? `${days} day${days === 1 ? '' : 's'} until we begin` : 'We begin today.'}</p></div>`;
  }
  function renderHeader(s){
    const session = findSession(s.current_session_id);
    return `<div class="header"><div class="greeting">Today</div><div class="day-name">${shortDay()}</div><div class="full-date">${todayLong()}</div><div class="liturgical-context">${calendarCardHtml}</div>${session ? `<div class="session-title">${session.week.title || 'Awaiting Session Title'}</div><div class="session-week">Week ${s.session_week_number} of ${session.phase.weeks.length} · ${session.phase.name.replace(/^[^—]+—\s*/, '')}</div>` : ''}</div>`;
  }
  function renderDayTabs(s){
    const d = s.day_kind;
    return `<div class="day-tabs" role="tablist" aria-label="Days of this week's session"><div class="day-tab ${d==='day1'?'active':''}"><span class="day-label">Monday</span>Day 1 · Teach</div><div class="day-tab ${d==='day2'?'active':''}"><span class="day-label">Wednesday</span>Day 2 · Work</div><div class="day-tab ${d==='day3'?'active':''}"><span class="day-label">Friday</span>Day 3 · Reflect</div></div>`;
  }
  function renderThreeDayView(s){
    if(s.day_kind === 'day1') return `<div class="main-frame"><div class="day-heading">Day 1 — The Teaching Day</div><div class="day-subheading">Today with your father</div><div class="artifact-slot placeholder" data-slot="lesson"><div class="artifact-icon">📖</div><div class="artifact-title">The Lesson</div><div class="artifact-blurb">Your father will teach this lesson to you. Read along and join in the discussion as he goes.</div></div><div class="artifact-slot placeholder" data-slot="parent_companion_link"><div class="artifact-icon">✦</div><div class="artifact-title">For Your Father</div><div class="artifact-blurb">A companion guide is ready for him with the discussion questions and teaching notes.</div></div><div class="artifact-slot placeholder" data-slot="opening_journal"><div class="artifact-icon">✎</div><div class="artifact-title">Your Opening Reflection</div><div class="artifact-blurb">After the teaching, write a short entry in your Field Manual about what struck you.</div></div><button class="complete-btn" data-action="complete-day-1">Mark Day 1 Complete</button></div>`;
    if(s.day_kind === 'day2') return `<div class="main-frame"><div class="day-heading">Day 2 — The Independent Day</div><div class="day-subheading">Today on your own</div><div class="artifact-slot placeholder" data-slot="personal_reading"><div class="artifact-icon">☩</div><div class="artifact-title">The Personal Reading</div><div class="artifact-blurb">Read this week's Scripture passage in your Holy Scriptures reader.</div></div><div class="artifact-slot placeholder" data-slot="workbook"><div class="artifact-icon">✎</div><div class="artifact-title">The Workbook</div><div class="artifact-blurb">Work through this week's exercises. You can do them on the tablet or print them.</div></div><div class="artifact-slot placeholder" data-slot="quiz1"><div class="artifact-icon">◈</div><div class="artifact-title">Quick Check</div><div class="artifact-blurb">A short check for understanding — five questions or so.</div></div><div class="artifact-slot placeholder" data-slot="session_game"><div class="artifact-icon">⚔</div><div class="artifact-title">The Session Game</div><div class="artifact-blurb">If a game is ready for this lesson, you'll find it here.</div></div><button class="complete-btn" data-action="complete-day-2">Mark Day 2 Complete</button></div>`;
    if(s.day_kind === 'day3') return `<div class="main-frame"><div class="day-heading">Day 3 — The Reflection Day</div><div class="day-subheading">What did this week mean?</div><div class="artifact-slot placeholder" data-slot="field_manual_entry"><div class="artifact-icon">📓</div><div class="artifact-title">Field Manual Entry</div><div class="artifact-blurb">Write your full reflection on this week's lesson in your Field Manual.</div></div><div class="artifact-slot placeholder" data-slot="session_test"><div class="artifact-icon">◈</div><div class="artifact-title">The Session Test</div><div class="artifact-blurb">A longer set of questions covering the whole week. Some will be marked for your father to read.</div></div><div class="artifact-slot placeholder" data-slot="memorization"><div class="artifact-icon">✦</div><div class="artifact-title">Memorization Practice</div><div class="artifact-blurb">Practice what you are learning by heart. When you're ready, ask your father to listen.</div></div><button class="complete-btn" data-action="complete-day-3">Complete the Week</button></div>`;
    return '';
  }
  function renderTopic00View(){
    const sess = sessionData.session;
    const renderState = SessionLoader.renderState(sess);

    // Coming soon — session row exists but content is not yet published
    if (renderState === 'coming_soon') {
      return `
        <div class="main-frame">
          <div class="day-heading">${esc(sess?.title || 'This Week')}</div>
          <div class="day-subheading">Coming soon</div>
          <div class="artifact-slot" style="text-align:center;padding:2rem 1.5rem;">
            <div class="artifact-icon">☩</div>
            <div class="artifact-title">This week's lesson is being prepared</div>
            <div class="artifact-blurb">${esc(sess?.scope_summary || 'Check back soon — this week\'s content will appear here when it\'s ready.')}</div>
          </div>
        </div>
      `;
    }

    // Missing — no row at all (shouldn't happen if spine is loaded, but degrade)
    if (renderState === 'missing') {
      return `
        <div class="main-frame">
          <div class="day-heading">This Week's Lesson</div>
          <div class="day-subheading">Take it gently — read, reflect, write</div>
          <div class="artifact-slot placeholder">
            <div class="artifact-icon">📖</div>
            <div class="artifact-title">Awaiting this week's content</div>
            <div class="artifact-blurb">The lesson for this week will appear here when it is ready.</div>
          </div>
        </div>
      `;
    }

    // Renderable — pull the real fields from the session row
    // Topic 00 light model uses: lesson_text, journal_prompt,
    // discussion_q1/2/3, reading_*, sunday_liturgy_pointer, liturgical_connection.
    // It does NOT use personal_activity / family_activity (NULL by design).

    const lessonHtml = sess.lesson_text
      ? `<div class="lesson-body">${formatLessonText(sess.lesson_text)}</div>`
      : '<p style="font-style:italic;color:rgba(244,232,193,0.55);">(lesson text not yet written)</p>';

    const discussionItems = [sess.discussion_q1, sess.discussion_q2, sess.discussion_q3]
      .filter(q => q && q.trim().length > 0);
    const discussionHtml = discussionItems.length
      ? `<ol class="discussion-questions">${discussionItems.map(q => `<li>${esc(q)}</li>`).join('')}</ol>`
      : '';

    const readingHtml = (sess.reading_reference || sess.reading_url)
      ? `
        <div class="artifact-slot" data-slot="personal_reading">
          <div class="artifact-icon">☩</div>
          <div class="artifact-title">A Reading from the Scriptures</div>
          ${sess.reading_reference ? `<div style="font-family:'Cinzel Decorative',serif;color:var(--gold-light);font-size:1rem;margin-bottom:0.4rem;">${esc(sess.reading_reference)}</div>` : ''}
          ${sess.reading_note ? `<div class="artifact-blurb" style="margin-bottom:0.8rem;">${esc(sess.reading_note)}</div>` : ''}
          ${sess.reading_url ? `<a href="${esc(sess.reading_url)}" class="reading-link">Open in the Holy Scriptures →</a>` : ''}
        </div>` : '';

    const journalHtml = sess.journal_prompt
      ? `
        <div class="artifact-slot" data-slot="field_manual_entry">
          <div class="artifact-icon">✎</div>
          <div class="artifact-title">A Field Manual Entry</div>
          <div class="artifact-blurb" style="font-style:normal;color:rgba(244,232,193,0.85);font-size:1rem;line-height:1.6;margin-bottom:0.8rem;">${esc(sess.journal_prompt)}</div>
          <a href="journal.html?session=${esc(sess.id)}&prompt=session" class="reading-link">Open Field Manual →</a>
        </div>` : '';

    const liturgicalHtml = sess.liturgical_connection
      ? `
        <div class="artifact-slot" data-slot="liturgical_connection">
          <div class="artifact-icon">⛪</div>
          <div class="artifact-title">At Liturgy This Sunday</div>
          <div class="artifact-blurb" style="font-style:normal;color:rgba(244,232,193,0.85);">${esc(sess.liturgical_connection)}</div>
        </div>` : '';

    const sundayPointerHtml = sess.sunday_liturgy_pointer
      ? `
        <div class="artifact-slot" data-slot="sunday_watch_for" style="background:rgba(107,26,26,0.15);">
          <div class="artifact-icon">☩</div>
          <div class="artifact-title">What to Watch For at Liturgy</div>
          <div class="artifact-blurb" style="font-style:normal;color:rgba(244,232,193,0.85);">${esc(sess.sunday_liturgy_pointer)}</div>
        </div>` : '';

    // For the parent (and admin/superuser), surface a link to the Companion page
    // The page itself enforces role gating; the link here is best-effort UX.
    const parentLinkHtml = `
      <div class="artifact-slot parent-link-slot" data-slot="parent_companion_link" style="background:rgba(44,22,84,0.2);">
        <div class="artifact-icon">✦</div>
        <div class="artifact-title">For Your Father</div>
        <div class="artifact-blurb">A teaching guide is available with discussion questions and notes for this lesson.</div>
        <a href="parent-companion.html?session=${esc(sess.id)}" class="reading-link">Open the Parent's Companion →</a>
      </div>`;

    // Day completion status from session_progress
    const isComplete = sessionData.progress?.completed_at != null;

    return `
      <div class="main-frame">
        <div class="day-heading">${esc(sess.title)}</div>
        <div class="day-subheading">This week's lesson</div>

        <div class="artifact-slot" data-slot="lesson">
          <div class="artifact-icon">📖</div>
          <div class="artifact-title">The Lesson</div>
          ${lessonHtml}
        </div>

        ${discussionHtml ? `
        <div class="artifact-slot" data-slot="discussion_questions">
          <div class="artifact-icon">✦</div>
          <div class="artifact-title">To Talk About With Your Father</div>
          ${discussionHtml}
        </div>` : ''}

        ${readingHtml}
        ${journalHtml}
        ${liturgicalHtml}
        ${sundayPointerHtml}
        ${parentLinkHtml}

        <button class="complete-btn" data-action="complete-week" data-session-id="${esc(sess.id)}" ${isComplete ? 'data-complete="true"' : ''}>
          ${isComplete ? '✓ This Week is Complete' : 'Mark This Week Complete'}
        </button>
      </div>
    `;
  }
  function renderSunday(){
    return `<div class="calm-frame"><div class="calm-icon">☩</div><div class="calm-title">This Sunday at Liturgy</div><div class="calm-text">Today is Sunday — the lived heart of the week. Go to Liturgy with your family.</div><div class="artifact-slot placeholder" data-slot="sunday_watch_for" style="margin-top:1.5rem;text-align:left;"><div class="artifact-icon">✦</div><div class="artifact-title">What to Watch For</div><div class="artifact-blurb">When this week's session is loaded, the one thing to listen for at Liturgy will be here.</div></div><div class="calm-quote">"Behold, I make all things new."</div></div>`;
  }
  function renderSaturday(){
    return `<div class="calm-frame"><div class="calm-icon">◈</div><div class="calm-title">Today is Saturday</div><div class="calm-text">Saturday is for rest. The Expedition does not ask anything of you today. Pray your morning and evening prayers, and prepare your heart for Liturgy tomorrow.</div><div class="calm-quote">"There remains a Sabbath rest for the people of God."</div></div>`;
  }
  function renderBetweenSessions(){
    return `<div class="calm-frame"><div class="calm-icon">✦</div><div class="calm-title">A Quiet Day</div><div class="calm-text">No new work today. The next teaching day is coming. You can revisit your Field Manual, practice your memorization, or read a saint's life.</div></div>`;
  }
  function renderUnknown(){
    return `<div class="calm-frame"><div class="calm-icon">☩</div><div class="calm-title">The Expedition is Complete</div><div class="calm-text">Three years have passed. You have walked the path. Glory to God.</div></div>`;
  }
  function renderSidebar(){
    return `<div class="sidebar"><div class="side-card"><div class="side-eyebrow">Earlier This Week</div><div class="side-content" data-slot="pending_work"><em>(Once you start completing days, anything not yet finished will appear here.)</em></div></div><div class="side-card"><div class="side-eyebrow">Coming Up</div><div class="side-content" data-slot="coming_up"><em>This Sunday's Liturgy.</em></div></div></div>`;
  }
  function renderSaintBanner(){
    const saint = sessionData.saint;
    if (!saint) {
      // No saint row yet — render placeholder
      return `<div class="saint-banner" data-slot="saint_of_week"><div class="saint-icon">☩</div><div class="saint-text"><div class="saint-eyebrow">This Week's Saint</div><div class="saint-name">— Awaiting Saint of the Week —</div></div></div>`;
    }
    const feastLine = saint.feast_day
      ? `<div class="saint-feast">Feast: ${esc(saint.feast_day)}</div>`
      : '';
    const iconImg = saint.icon_url
      ? `<img src="${esc(saint.icon_url)}" alt="${esc(saint.saint_name || '')}" />`
      : '☩';
    return `
      <div class="saint-banner" data-slot="saint_of_week">
        <div class="saint-icon">${iconImg}</div>
        <div class="saint-text">
          <div class="saint-eyebrow">This Week's Saint</div>
          <div class="saint-name">${esc(saint.saint_name || '— Saint not yet named —')}</div>
          ${feastLine}
        </div>
      </div>`;
  }
  function renderBottomNav(){
    return `<div class="bottom-nav"><a href="journal.html">Field Manual</a><a href="bible-reader.html">Holy Scriptures</a><a href="games.html">Training Grounds</a><a href="index.html?signout=1">Sign Out</a></div>`;
  }

  // ── DAY-COMPLETION BUTTON (Topic 00 light model) ──
  // Per Chat 1 Decision 2: Topic 00 single-button completion writes
  // ONLY to day_3_completed_at. Days 1 and 2 stay NULL. Chat 2 will
  // enforce this at the DB level via a CHECK or trigger keyed on
  // weekly_model='light'; until then, the app layer is the contract.
  // The DB trigger sets completed_at when day_3_completed_at is populated
  // for a Topic 00 session (light model doesn't require day_1 / day_2).
  document.addEventListener('click', async (e) => {
    const btn = e.target.closest('.complete-btn[data-session-id]');
    if (!btn) return;
    if (btn.getAttribute('data-complete') === 'true') return;
    e.preventDefault();

    const sessionId = btn.dataset.sessionId;
    if (!sessionId || !profileId) {
      console.warn('[completion] Missing sessionId or profileId; cannot record.');
      return;
    }

    const original = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Recording...';

    try {
      const { error } = await sb
        .from('session_progress')
        .upsert(
          {
            profile_id: profileId,
            session_id: sessionId,
            day_3_completed_at: new Date().toISOString(),
          },
          { onConflict: 'profile_id,session_id' }
        );

      if (error) throw error;

      btn.setAttribute('data-complete', 'true');
      btn.textContent = '✓ This Week is Complete';
      btn.disabled = true;
      console.log('[completion] Wrote day_3_completed_at for session', sessionId);
    } catch (err) {
      console.error('[completion] Write failed:', err);
      btn.disabled = false;
      btn.textContent = original;
      // Show a small inline error briefly
      const msg = document.createElement('div');
      msg.textContent = 'Could not save just now — please try again.';
      msg.style.cssText = 'margin-top:0.5rem;font-family:Cinzel,serif;font-size:0.7rem;letter-spacing:0.1em;color:rgba(244,180,180,0.85);text-align:center;text-transform:uppercase;';
      btn.parentElement.appendChild(msg);
      setTimeout(() => msg.remove(), 4000);
    }
  });
})();
</script>

<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
